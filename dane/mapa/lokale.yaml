# Lokale i działki – globalna pula (lokal zajęty przez drużynę znika z oferty innych)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Lokale do najmu lub kupna. Kwoty w złotych, czynsz i utrzymanie (media) miesięczne – silnik przelicza je
  na rundę. gotowy: działa od razu, sprzęt wynajmującego (przy najmie nie można go sprzedać); niewyposazony: 1 runda
  urządzania, jednorazowa adaptacja, cały sprzęt trzeba kupić; dzialka: tylko kupno, budowa budowa_rund rund, koszt_budowy
  płatny w równych ratach co rundę budowy. miejsca: ile stanowisk każdego typu zmieści lokal. Kaucja przy najmie:
  kaucja_miesiecy × czynsz (zwrotna po końcu najmu).'
zrodlo: 'założenie autora: czynsz = metraż × stawka strefy (strefy.yaml: czynsz_m2; gotowy +25%), cena kupna ≈ 60
  miesięcznych czynszów (gotowy +10%; kalibracja 6.11.2026: ×1,5 z 40 – pomiar botów, przy 40 kupno wygrywało
  z najmem w 75% par już w 18 rundach; rynek ok. 150 czynszów, ceny przeskalowane do kapitału gry), działka = m² gruntu × 3 × czynsz_m2,
  budowa 900 zł/m², adaptacja 100 zł/m², media 300 zł + 25 zł/m²; niewyposażony: czynsz i cena kupna −25% (test gry
  28.10: lokal do urządzenia razem z adaptacją i zakupem sprzętu wychodził drożej niż gotowy z zestawem); rząd wielkości (oferty najmu w Lublinie 2025:
  40–130 zł/m²), do kalibracji'
# od_firm: lokal jest na mapie tylko w grze z co najmniej tyloma firmami – 8 firm: 38 lokali, 6–7: 29,
# 4–5: 20 (około 5 na firmę, proporcje typów podobne); popyt miasta się nie zmienia
zasady:
  nowy_lokal_co_rund: 3
  kaucja_miesiecy: 2
  urzadzanie_rund: 1
  # licytacje (od rundy 1, test gry 28.10) i przejęcia (od rundy 4): kilka drużyn o ten sam lokal – wygrywa najwyższa oferta względem ceny
  # wywoławczej (czynszu albo ceny), remis – losowanie; kupno budynku z najemcą, wypowiedzenie 4 rundy (KC art. 673,
  # 678), rozliczenie nakładów najemcy (KC art. 676): zatrzymanie – właściciel płaci ulepszenia_zwrot × nakłady,
  # przywrócenie stanu – najemca płaci przywrocenie_koszt × nakłady
  licytacje_od_rundy: 1
  oferta_max: 3
  # licytacja jawna (poprawki 2, decyzja autora): oferta musi przebić najwyższą ofertę innej drużyny o ten ułamek
  # (pewnosc: założenie do kalibracji z gry na żywo; zrodlo: decyzja autora o jawnej licytacji lokali)
  krok_przebicia: 0.02
  przejecia_od_rundy: 4
  wypowiedzenie_rund: 4
  ulepszenia_zwrot: 0.5
  przywrocenie_koszt: 0.3
zestawy:
  podstawowy:
    nazwa: Zestaw podstawowy (★)
    opis: 'Używany sprzęt po poprzednim najemcy: działa, choć rożen skrzypi przy każdym obrocie.'
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 1
        Frytownica: 1
        Lodówka na napoje: 1
        Szafa chłodnicza: 1
        Zamrażarka: 1
    - typ: kasa
      sprzet:
        Kasa fiskalna: 1
        Lada z witryną: 1
        Tablica menu: 1
  solidny:
    nazwa: Zestaw solidny (★★)
    opis: Zadbany sprzęt średniej klasy z kompletną kasą.
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
        Lodówka na napoje: 2
        Szafa chłodnicza: 2
        Zamrażarka: 2
    - typ: kasa
      sprzet:
        Kasa fiskalna: 2
        Lada z witryną: 2
        Tablica menu: 2
  # ★★★ (założenie, 14.11): ten sam układ stanowisk co solidny, ale cały sprzęt w jakości 3 (ceny i utrzymanie – sprzet.yaml,
  # jakość 3 jest droższa w zakupie i tańsza w utrzymaniu). Kupić go można w jednym lokalu (centrum_1); poza tym ★★★ osiąga się
  # dokupując sprzęt jakości 3 (decyzja sprzet_kup).
  profesjonalny:
    nazwa: Zestaw profesjonalny (★★★)
    opis: 'Sprzęt jak z kuchni dużej sieci: lśniący rożen, szybka frytownica i kasa bez zacięć. Poprzedni najemca zostawił nawet instrukcje obsługi.'
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 3
        Frytownica: 3
        Lodówka na napoje: 3
        Szafa chłodnicza: 3
        Zamrażarka: 3
    - typ: kasa
      sprzet:
        Kasa fiskalna: 3
        Lada z witryną: 3
        Tablica menu: 3
  podwojny:
    nazwa: Zestaw podwójny (★★)
    opis: Dwie linie kuchenne i kasa – lokal po dużej sieci, która „zmieniła strategię”.
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
        Lodówka na napoje: 2
        Szafa chłodnicza: 2
        Zamrażarka: 2
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
    - typ: kasa
      sprzet:
        Kasa fiskalna: 2
        Lada z witryną: 2
        Tablica menu: 2
