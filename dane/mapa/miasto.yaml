    mapa: {x: 20, y: 11}
  - id: plac_litewski
    nazwa: Plac Litewski
    ksztalt: fontanna
    opis: Główny plac miasta przy Krakowskim Przedmieściu, z multimedialną fontanną i pomnikiem Unii Lubelskiej.
    mapa: {x: 10, y: 9}
  - id: csk
    nazwa: Centrum Spotkania Kultur
    ksztalt: csk
    opis: Nowoczesny gmach teatru i opery z ogrodem na dachu, przy Placu Teatralnym.
    mapa: {x: 10, y: 8}
  - id: umcs
    nazwa: UMCS
    ksztalt: uczelnia
    opis: Uniwersytet Marii Curie-Skłodowskiej – największa uczelnia w mieście, sporo głodnych studentów.
    mapa: {x: 5, y: 8, szer: 2}
  - id: kul
    nazwa: KUL
    ksztalt: uczelnia
    opis: Katolicki Uniwersytet Lubelski przy Alejach Racławickich – najstarsza uczelnia Lublina (1918).
    mapa: {x: 7, y: 11, szer: 2}
  - id: politechnika_lubelska
    nazwa: Politechnika Lubelska
    ksztalt: uczelnia
    opis: Kampus przy ulicy Nadbystrzyckiej – inżynierowie, laboratoria i kolejki po obiad.
    mapa: {x: 10, y: 15, szer: 2}
  - id: dworzec_metropolitalny
    nazwa: Dworzec Metropolitalny
    ksztalt: dworzec
    opis: Węzeł autobusów miejskich, podmiejskich i dalekobieżnych obok dworca kolejowego Lublin Główny.
    mapa: {x: 14, y: 15, szer: 3, gl: 2}
  - id: arena
    nazwa: Arena Lublin
    ksztalt: stadion
    opis: Stadion miejski na kilkanaście tysięcy kibiców – w dni meczów kebaby w okolicy mają pełne ręce roboty.
    mapa: {x: 21, y: 16, szer: 2, gl: 2}
  - id: lotnisko
    nazwa: Port Lotniczy Lublin
    ksztalt: lotnisko
    opis: Lotnisko w Świdniku, na wschód od miasta – samoloty do Londynu, Oslo i na wakacje.
    mapa: {x: 26, y: 21, szer: 3, gl: 3}
  - id: gorki_czechowskie
    nazwa: Górki Czechowskie
    ksztalt: gorki
    opis: Dzikie wzgórza i wąwozy na Czechowie – ulubione miejsce spacerów, biegów i wiosennych pikników.
    mapa: {x: 5, y: 2, szer: 3, gl: 3}
