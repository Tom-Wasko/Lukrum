# Wygląd mapy Lublina (M1–M11): układ dzielnic, drogi, rzeka, punkty orientacyjne, ruch i pora dnia. Tylko wygląd –
# nic tu nie zmienia zasad gry (silnik liczy z położeń w lokale.yaml, budynki.yaml, strefy.yaml).
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Schematyczna mapa Lublina. uklad – siatka do rysowania (x na wschód, y na południe), kształty dzielnic z pól
  (wiersze liter) i pola lokali oraz budynków; drogi, kolej i rzeka to gładkie krzywe przez punkty kontrolne (x 0–szer,
  y 0–gl, margines – teren podmiejski; końce na brzegu marginesu ciągną się za kadr) i nie mogą przecinać zajętych pól.
  Punkty orientacyjne zajmują wolne pola. ruch.godziny – natężenie ruchu o każdej pełnej godzinie (0–1). wspolrzedne –
  do położenia słońca.'
zrodlo: 'decyzje autora 8.11.2026 (mapa schematyczna, lekka izometria, drogi tylko wizualne, bez Majdanka, ruch,
  warstwy, pora dnia; potem: układ jak plan Lublina, drogi nie proste, porządek, lokale łatwe do znalezienia);
  przebieg ulic i rzeki uproszczony względem prawdziwego Lublina'
