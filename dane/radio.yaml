# Radio „Fala Koziołka” (seria radio, decyzje szefa 19.11.2026; notatki/Serie/radio/radio – lista nagrań.md).
# Tylko nastrój: silnik tego pliku nie czyta (panel_gracza/radio.py → /radio.json i strona /nagrania-w-radiu).
# Pliki: panel_gracza/static/radio/<plik>. Każde nagranie: tytul, autor (utworu), wykonawca, rok (nagrania),
# zrodlo (strona z plikiem), licencja (dozwolone: domena publiczna, CC0, CC BY, CC BY-SA, Licencja Wolnej Sztuki 1.3),
# plik, sekundy. Nowe nagranie: najpierw sprawdzić licencję i zapisać podstawę, potem dopisać tutaj (pilnuje test).
# Teksty prowadzącego: neutralne płciowo, bez cytatów z innych gier; {stacja} {fala} w powitaniach, {tytul} {wykonawca} w zapowiedziach.
opis: 'Radio „Fala Koziołka” na pulpicie gracza: stacje, nagrania z opisem licencji i teksty prowadzącego. Tylko nastrój, bez wpływu na wynik.'
zrodlo: 'Decyzje szefa 19.11.2026 (notatki/Decyzje.md, radio); źródło i licencja każdego nagrania w polach zrodlo i licencja.'
nadawca:
  nazwa: Fala Koziołka
  opis: Radio z ul. Zana 39 (2. piętro) w grze. Gra stare płyty i nagrania z wolnych licencji.
podstawa:
- 'Nagrania z płyt i wałków sprzed 1926 r.: w USA są w domenie publicznej, a w Polsce prawa do tak starych nagrań i wykonań dawno wygasły (trwały
  50 lat).'
- 'Utwory: kompozytorzy i autorzy tekstów zmarli przed 1956 r. (prawa autorskie trwają 70 lat po śmierci), a pieśni bez znanego autora są utworami
  anonimowymi, których prawa wygasły 70 lat po pierwszym rozpowszechnieniu (art. 36 pkt 2 ustawy o prawie autorskim).'
- 'Muzyka klasyczna: nowe nagrania organizacji Musopen, które jej autorzy oddali do domeny publicznej (CC0 albo znak domeny publicznej 1.0, Internet
  Archive).'
- '„Lalka”: audiobook Fundacji Wolne Lektury na Licencji Wolnej Sztuki 1.3 – wolno go odtwarzać i rozpowszechniać z podaniem autora, wykonawcy
  i licencji.'
- Pliki są przerobione na mono MP3, żeby paczka była mała i gra działała bez internetu. Treść nagrań się nie zmienia.
- Teksty prowadzącego napisano dla LUKRUM, a czyta je syntezator mowy przeglądarki.
prowadzacy:
  co_ile: 2
  powitania:
  - Tu Fala Koziołka, program {stacja}, {fala} megaherca.
  - 'Jeśli ktoś nas słyszy: tu {stacja} na fali {fala}. Lublin nadaje, rożny się kręcą.'
  - Halo, halo, tu Fala Koziołka. Nadajemy z ulicy Zana, z drugiego piętra, dopóki starczy prądu.
  - Dzień dobry wszystkim przy odbiornikach. Tu {stacja}, Fala Koziołka.
  wtracenia:
  - 'Komunikat dla wszystkich lokali w mieście: list z decyzjami nie wyśle się sam.'
  - 'Wujek prosił przekazać: następny krok jest w zeszycie.'
  - 'Prognoza dla handlu: jutro też będzie dzień, a ludzie też będą głodni.'
  - 'Przypominamy: gotówka w szufladzie to jeszcze nie zysk. Zysk liczy się po kosztach.'
  - Na antenie spokojnie, w kuchni gorąco. Pozdrawiamy wszystkich za ladą.
  - 'Ostrzeżenie dla przedsiębiorców: debet w banku trzeba kiedyś oddać, i to z odsetkami.'
  - 'Z redakcji przy Zana: czajnik działa, gramofon działa, antena trzyma się na słowo honoru.'
  - Kto słucha nas w przerwie między zamówieniami, temu dedykujemy następną płytę.
  - Na zewnątrz miasto, w eterze trzaski. Nie przełączajcie się.
  - Ceny w hurtowni się zmieniają, a stare płyty brzmią tak samo. To pociesza.
  - Rachunki z hurtowni warto zachować. Urząd skarbowy ma dobrą pamięć.
  - Słychać nas od Starego Miasta po Felin. Dalej już tylko szum, ale też miły.
  - Zespół Fali Koziołka życzy wszystkim pełnej sali i szybkiej obsługi.
  - Mówi Fala Koziołka. Prąd jest, płyty są, nadajemy dalej.
  zapowiedzi:
  - 'Teraz: {tytul}. Wykonanie: {wykonawca}.'
  - 'Z naszej płytoteki: {tytul}.'
  - 'Posłuchajmy: {tytul}.'
  - 'Kolejna płyta z szafy: {tytul}, {wykonawca}.'
