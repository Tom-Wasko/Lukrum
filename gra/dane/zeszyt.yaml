# Zeszyt wujka: treść stron tygodni i stron „gdzie co najlepiej kupić”. Panel czyta ją przez `v.zeszyt`
# (api/zeszyt.py), a odhaczanie zadań liczy gra z widoku `v` i z zapisanych wizyt (gry/models.py: Runda.zeszyt).
opis: >-
  Zeszyt wujka: strony tygodni (list, zadania, dopisek) i strony „gdzie co najlepiej kupić”. Zadanie ma tekst, żeton
  mapy, punkt sceny i warunek odhaczenia liczony ze stanu gry po decyzjach roboczych (widok v). Tydzień liczony od
  pierwszej rundy gry (runda - runda_startowa + 1).
zrodlo: decyzje szefa 16.11.2026 (noc), „Wnętrza i pulpit” pkt 1 i 3; treść – projekt Fable 17.11.2026, przyjęta przez szefa 19.11.2026 (seria zeszyt)

# --- słownik warunków -----------------------------------------------------------------------------------------
# Warunek to NAZWA z tej listy (plus opcjonalny parametr), a nie wyrażenie: implementacja jest w jednym miejscu w kodzie
# (panel_gracza/static/pulpit/zeszyt-warunki.js: WARUNKI), test pilnuje, że każda nazwa z danych ma implementację.
# rodzaj: stan – z v.stan; decyzja – klucz obecny w decyzjach roboczych tygodnia; wizyta – gracz wszedł do miejsca
#         w bieżącej rundzie (zapisuje serwer, v.zeszyt.wizyty); wyslane – v.wyslane.
warunki:
  ma_lokal:            {rodzaj: stan, opis: "(v.stan.lokale || []).length > 0"}
  ma_bank:             {rodzaj: stan, opis: "!!v.stan.bank"}
  ma_biuro:            {rodzaj: stan, opis: "!!v.stan.biuro (biuro albo „samodzielnie”)"}
  ma_menu:             {rodzaj: stan, opis: "Object.keys(v.stan.oferta || {}).length > 0"}
  ma_stanowiska:       {rodzaj: stan, opis: "jest stanowisko typu kuchnia i typu kasa"}
  ma_sprzet:           {rodzaj: stan, opis: "brak uwagi „stanowiska z pracownikiem” w gotowe_uslugi (każde danie ma sprzęt)"}
  ma_ludzi:            {rodzaj: stan, opis: "(v.stan.pracownicy || []).length > 0"}
  obsada_pelna:        {rodzaj: stan, opis: "brak uwagi „obsadzonego stanowiska”"}
  towar_jest:          {rodzaj: stan, opis: "brak uwagi „brak składnika”"}
  ceny_ustawione:      {rodzaj: stan, opis: "brak uwagi „włączone do sprzedaży”"}
  promocja_wlaczona:   {rodzaj: stan, opis: "lista promocji niepusta"}
  ma_polise:           {rodzaj: stan, opis: "lista polis niepusta"}
  ma_wyposazenie:      {rodzaj: stan, opis: "kupione wyposażenie albo styl wystroju inny niż podstawowy"}
  ma_udogodnienie:     {rodzaj: stan, opis: "lista udogodnień niepusta"}
  kampania_trwa:       {rodzaj: stan, parametr: agencja, opis: "trwa kampania danej agencji (albo dowolnej, gdy bez parametru)"}
  ma_lokate:           {rodzaj: stan, opis: "założona lokata"}
  szkolenie_trwa:      {rodzaj: stan, opis: "ktoś jest na szkoleniu albo je ukończył"}
  danie_specjalne:     {rodzaj: stan, opis: "w ofercie jest danie specjalne strefy"}
  bez_drogiego_dlugu:  {rodzaj: stan, opis: "brak pożyczki u Harpagona i brak debetu"}
  zamowienie_u:        {rodzaj: decyzja, parametr: dostawca, opis: "w zamowienia jest pozycja u danego dostawcy"}
  higiena_wybrana:     {rodzaj: decyzja, opis: "klucz higiena ustawiony kiedykolwiek (trwa do zmiany)"}
  wizyta:              {rodzaj: wizyta, parametr: miejsce, opis: "wejście do wnętrza (id sceny) w bieżącej rundzie"}
  wyslane:             {rodzaj: wyslane, opis: "v.wyslane"}

# --- zadania stałe (na każdej stronie od tygodnia 2, pod zadaniami tygodnia) -------------------------------------
stale:
  od_tygodnia: {wartosc: 2, pewnosc: zalozenie, zrodlo: "szkic Fable 17.11.2026: w tygodniu 1 nic się jeszcze nie sprzedaje"}
  zadania:
    - {id: towar,   tekst: "Towar na cały tydzień",        kartka: "Towar na cały tydzień", zeton: makro,    punkt: zaop_dostawy,  warunek: towar_jest}
    - {id: ceny,    tekst: "Każde danie ma cenę",           kartka: "Każde danie ma cenę",   zeton: lokal,    punkt: lokal_menu,    warunek: ceny_ustawione}
    - {id: obsada,  tekst: "Każde stanowisko ma człowieka", kartka: "Obsadźcie stanowiska",  zeton: lokal,    punkt: zespol,        warunek: obsada_pelna}
    - {id: wyniki,  tekst: "Przeczytane wyniki",            kartka: "Przeczytajcie wyniki",  zeton: redakcja, punkt: karta_wynikow, warunek: {wizyta: redakcja},
       od_tygodnia: {wartosc: 3, pewnosc: zalozenie, zrodlo: "szkic Fable 17.11.2026: pierwsze wyniki są po zamknięciu drugiego tygodnia"}}
    - {id: wyslij,  tekst: "Wyślijcie decyzje",             kartka: "Wyślijcie decyzje",     zeton: poczta,   punkt: wyslij,        warunek: wyslane}

# --- strony tygodni -----------------------------------------------------------------------------------------------
# zeton: id z dane/mapa/budynki.yaml (albo „lokal” = lokal drużyny, „bazar” = bazar bez żetonu); punkt: ekran panelu;
# kartka: tekst na kartce wystającej z zamkniętego zeszytu, gdy to zadanie jest następne (najwyżej 6 słów);
# czemu: zdanie wujka; element: element harmonogramu (silnik/harmonogram.py), od którego zadanie ma sens – zadanie
#   znika, gdy element jest zablokowany (jest wtedy `zastepstwo`, jeśli podano); funkcja: klucz z dane/funkcje.yaml
#   (zakryta – zadanie wyszarzone, wyłączona – brak zadania).
# warunek wizyta: id sceny (swiat/sceny/index.js), np. uczelnia, redakcja, kebab (własny lokal), pierzeja_bankowa.
tygodnie:
  1:
    tytul: "Klucze są Wasze"
    list: >-
      Zanim przyjdzie pierwszy gość, trzeba mieć gdzie, z kim i z czego gotować. W tym tygodniu jeszcze nic się nie
      sprzedaje, więc spokojnie: idźcie po kolei, jak w zeszycie. Najważniejszy jest lokal, bo od okolicy zależy, kto
      do Was przyjdzie.
    zadania:
      - {id: lokal, tekst: "Wybierzcie lokal", kartka: "Wybierzcie lokal", zeton: agencja_nieruchomosci, punkt: lokale, warunek: ma_lokal,
         czemu: "Lokal to połowa interesu. Drogi w centrum albo tani na osiedlu: policzcie, kto tam chodzi."}
      - {id: bank, tekst: "Załóżcie konto firmowe", kartka: "Załóżcie konto w banku", zeton: kamienica_bankowa, punkt: bank, warunek: ma_bank,
         czemu: "Bez konta nie ma firmy. Banki różnią się opłatą i tym, co potem pożyczą."}
      - {id: biuro, tekst: "Zdecydujcie, kto prowadzi księgi", kartka: "Wybierzcie biuro rachunkowe", zeton: kamienica_rachmistrzow, punkt: biuro, warunek: ma_biuro,
         czemu: "Papiery muszą się zgadzać. Biuro kosztuje, ale śpi się spokojniej."}
      - {id: menu, tekst: "Ułóżcie menu", kartka: "Ułóżcie menu", zeton: lokal, punkt: lokal_menu, warunek: ma_menu,
         czemu: "Na start trzy dania. Lepiej trzy dobre niż siedem byle jakich."}
      - {id: stanowiska, tekst: "Zamówcie stanowiska: kuchnię i kasę", kartka: "Zamówcie ladę i blat", zeton: stolarnia, punkt: stanowiska, warunek: ma_stanowiska,
         czemu: "Najpierw lada i blat, potem maszyny."}
      - {id: sprzet, tekst: "Kupcie sprzęt", kartka: "Kupcie rożen", zeton: sprzet_gastro, punkt: wnetrze_sprzet, warunek: ma_sprzet, element: inwestycje_sprzet,
         zastepstwo: {tekst: "Obejrzyjcie sprzęt i policzcie, na co Was stać", warunek: {wizyta: sprzet_gastro}},
         czemu: "Rożen kupuje się w Parku handlowym, w sklepie „Konstruktorzy T&K”, nigdzie indziej. Bez rożna nie ma kebaba."}
      - {id: ludzie, tekst: "Zatrudnijcie ludzi", kartka: "Zatrudnijcie ludzi", zeton: agencja_pracy, punkt: rynek_pracy, warunek: ma_ludzi,
         czemu: "Ktoś musi stanąć przy rożnie i przy kasie. Dobrzy rozchodzą się pierwsi."}
      - {id: wyslij, tekst: "Wyślijcie decyzje", kartka: "Wyślijcie decyzje", zeton: poczta, punkt: wyslij, warunek: wyslane,
         czemu: "Co postanowione, trzeba nadać. Do zamknięcia tygodnia można poprawiać."}
  2:
    tytul: "Otwieramy!"
    list: >-
      Od dziś liczy się każda porcja. Sprawdźcie, czy jest towar w chłodni, czy każde danie ma swoje stanowisko i kogoś,
      kto przy nim stanie. Na początku przychodzi mniej gości, więc nie zamawiajcie towaru jak na wesele.
    zadania:
      - {id: pieczywo, tekst: "Zamówcie pieczywo", kartka: "Pieczywo z piekarni", zeton: piekarnia, punkt: zaop_dostawy, warunek: {zamowienie_u: "Piekarnia Koziołek"}, element: dostawcy, funkcja: zaopatrzenie,
         czemu: "Pieczywo z piekarni: najtaniej i codziennie świeże."}
      - {id: mieso, tekst: "Zamówcie mięso", kartka: "Mięso z hurtowni", zeton: selgros, punkt: zaop_dostawy, warunek: towar_jest, element: dostawcy, funkcja: zaopatrzenie,
         czemu: "Mięso z hurtowni. Dowożą dwa razy w tygodniu, więc liczcie z zapasem."}
      - {id: reszta, tekst: "Dokupcie warzywa, sosy i napoje", kartka: "Reszta towaru z dyskontu", zeton: biedronka, punkt: zaop_dostawy, warunek: towar_jest, element: dostawcy, funkcja: zaopatrzenie,
         czemu: "W dyskoncie taniej, ale wozicie sami i dają po cztery opakowania."}
      - {id: ceny, tekst: "Ustawcie ceny dań", kartka: "Ustawcie ceny", zeton: lokal, punkt: lokal_menu, warunek: ceny_ustawione, element: sprzedaz,
         czemu: "Cena ma pokryć towar, ludzi i czynsz. Dopiero to, co zostanie, jest Wasze."}
      - {id: obsada, tekst: "Sprawdźcie obsadę kasy i kuchni", kartka: "Obsadźcie kasę", zeton: lokal, punkt: zespol, warunek: obsada_pelna,
         czemu: "Pusty posterunek to stracony gość."}
      - {id: analizy, tekst: "Zajrzyjcie do Pracowni Analiz", kartka: "Zobaczcie, kto tu mieszka", zeton: uczelnia, punkt: klienci, warunek: {wizyta: uczelnia}, funkcja: analiza,
         czemu: "Zobaczcie, kto mieszka w Waszej okolicy i ile może zapłacić."}
  3:
    tytul: "Pierwsze rachunki"
    list: >-
      Zajrzyjcie do kasy i do „Kuriera rankingowego”: tam widać, co zarobiło, a co zjadło pieniądze. Strata na początku
      to nie wstyd. Wstyd to nie wiedzieć, skąd się wzięła.
    zadania:
      - {id: wyniki, tekst: "Przeczytajcie pierwsze wyniki", kartka: "Przeczytajcie „Kuriera”", zeton: redakcja, punkt: karta_wynikow, warunek: {wizyta: redakcja}, element: karta_wynikow,
         czemu: "Najpierw trzy duże liczby: goście, przychód, dochód."}
      - {id: producent, tekst: "Mięso zamówcie u producenta", kartka: "Mięso prosto z zakładu", zeton: rozen, punkt: zaop_dostawy, warunek: {zamowienie_u: "Zakłady Mięsne „Rożen” z Łęcznej"}, element: dostawcy_producent, funkcja: zaopatrzenie,
         czemu: "Zakłady „Rożen” otwierają zbyt. Taniej i lepiej, ale biorą tylko większe zamówienia."}
      - {id: promocja, tekst: "Włączcie pierwszą promocję", kartka: "Włączcie promocję", zeton: lokal, punkt: promocje, warunek: promocja_wlaczona, element: promocje, funkcja: marketing,
         czemu: "Promocja ma przyprowadzić gościa, nie rozdać zysku."}
      - {id: udogodnienia, tekst: "Pomyślcie o zespole", kartka: "Coś dla zespołu", zeton: galeria, punkt: hr_rozwoj, warunek: ma_udogodnienie, element: hr_udogodnienia, funkcja: rozwoj,
         czemu: "Zmęczony kucharz kroi wolniej. Czajnik i szafka to nie luksus."}
  4:
    tytul: "Czas pomyśleć o gościach i o pechu"
    list: >-
      Lokal już chodzi, teraz niech będzie przyjemny i bezpieczny. W Parku handlowym kupicie wyposażenie i wystrój.
      Wybierzcie taki, jaki lubią ludzie z Waszej okolicy, a nie taki, jaki podoba się Wam.
    zadania:
      - {id: wystroj, tekst: "Kupcie stoliki albo wystrój", kartka: "Stoliki i wystrój", zeton: market_budowlany, punkt: wnetrze_wyposazenie, warunek: ma_wyposazenie, element: inwestycje_wyposazenie, funkcja: wyposazenie,
         czemu: "Goście jedzą też oczami."}
      - {id: polisa, tekst: "Ubezpieczcie lokal", kartka: "Ubezpieczcie lokal", zeton: ubezpieczyciel, punkt: ubezpieczenia, warunek: ma_polise, element: ubezpieczenia, funkcja: urzedy,
         czemu: "Od tego tygodnia zdarzają się awarie i wypadki. Polisa kosztuje mało, pech dużo."}
      - {id: higiena, tekst: "Ustawcie poziom higieny", kartka: "Sanepid: poziom higieny", zeton: sanepid, punkt: sanepid, warunek: higiena_wybrana, element: sanepid, funkcja: urzedy,
         czemu: "Sanepid zaczyna chodzić po lokalach. Mandat jest droższy niż ścierka."}
      - {id: tabela, tekst: "Sprawdźcie tabelę za cztery tygodnie", kartka: "Sprawdźcie tabelę", zeton: redakcja, punkt: ranking, warunek: {wizyta: redakcja}, element: karta_skumulowana,
         czemu: "Widać już, kto ucieka, a kto goni."}
  5:
    tytul: "Wracają studenci"
    zadania:
      - {id: ulotki, tekst: "Zamówcie ulotki albo plakaty", kartka: "Ulotki przed akademikami", zeton: biurowiec_zana, punkt: agencje, warunek: {kampania_trwa: papier_przyjmie}, element: reklama_papier_przyjmie, funkcja: marketing,
         czemu: "Zaczyna się rok akademicki. Kto pierwszy powiesi plakat przy akademiku, ten ma kolejkę."}
      - {id: kalendarz, tekst: "Sprawdźcie kalendarz miasta", kartka: "Kalendarz miasta", zeton: uczelnia, punkt: kalendarz, warunek: {wizyta: uczelnia}, funkcja: analiza,
         czemu: "Juwenalia, mecze, jarmarki: tłum trzeba przewidzieć."}
  6:
    tytul: "Nadwyżki i braki"
    zadania:
      - {id: bazar, tekst: "Sprzedajcie nadmiar albo kupcie okazję", kartka: "Zajrzyjcie na bazar", zeton: bazar, punkt: handel, warunek: {wizyta: bazar}, element: handel, funkcja: handel,
         czemu: "Czego macie za dużo, tego komuś brakuje."}
      - {id: lokata, tekst: "Wolną gotówkę odłóżcie na lokatę", kartka: "Lokata w banku", zeton: kamienica_bankowa, punkt: bank, warunek: ma_lokate,
         czemu: "Pieniądz w szufladzie nie pracuje."}
      - {id: dlug, tekst: "Sprawdźcie ratę i debet", kartka: "Sprawdźcie dług", zeton: kamienica_bankowa, punkt: bank, warunek: {wizyta: pierzeja_bankowa},
         czemu: "Dług trzeba znać na pamięć."}
  7:
    tytul: "Ludzie i sieć"
    zadania:
      - {id: szkolenie, tekst: "Zapiszcie kogoś na szkolenie", kartka: "Szkolenie dla zespołu", zeton: akademia, punkt: hr_rozwoj, warunek: szkolenie_trwa, element: hr_szkolenia, funkcja: rozwoj,
         czemu: "Wyszkolony kucharz robi więcej porcji z tego samego mięsa."}
      - {id: internet, tekst: "Spróbujcie reklamy w internecie", kartka: "Reklama w internecie", zeton: biurowiec_zana, punkt: internet, warunek: {kampania_trwa: internet}, element: internet, funkcja: marketing,
         czemu: "Młodzi szukają kebaba w telefonie, nie na słupie."}
      - {id: pensje, tekst: "Przejrzyjcie umowy i pensje", kartka: "Umowy i pensje", zeton: lokal, punkt: zespol, warunek: {wizyta: kebab},
         czemu: "Kto dobrze pracuje, niech dobrze zarabia, bo odejdzie."}
  8:
    tytul: "Coś specjalnego"
    zadania:
      - {id: specjalne, tekst: "Dodajcie danie specjalne Waszej okolicy", kartka: "Danie specjalne", zeton: lokal, punkt: lokal_menu, warunek: danie_specjalne, element: danie_kebab_specjalny_1,
         czemu: "Każda dzielnica ma swój smak. Dajcie jej to, czego nie ma u konkurencji."}
      - {id: radio, tekst: "Rozważcie radio albo billboard", kartka: "Radio albo billboard", zeton: biurowiec_zana, punkt: agencje, warunek: {kampania_trwa: fala_koziolka}, element: reklama_fala_koziolka, funkcja: marketing,
         czemu: "Radio słyszy całe miasto, ale i kosztuje jak całe miasto."}
      - {id: rywal, tekst: "Sprawdźcie rywala", kartka: "Detektyw: sprawdźcie rywala", zeton: detektyw, punkt: konkurencja, warunek: {wizyta: detektyw}, element: detektyw, funkcja: analiza,
         czemu: "Nie zgadujcie, ile bierze sąsiad. Zapytajcie tego, kto wie."}
  9:
    tytul: "Półmetek"
    zadania:
      - {id: polowa, tekst: "Porównajcie pierwszą i drugą połowę", kartka: "Archiwum „Kuriera”", zeton: redakcja, punkt: raport, warunek: {wizyta: redakcja},
         czemu: "Połowa sezonu za Wami. Co zarabia, to rozwijać; co traci, to ciąć."}
      - {id: drugi_lokal, tekst: "Zdecydujcie: drugi lokal czy lepszy pierwszy", kartka: "Drugi lokal?", zeton: agencja_nieruchomosci, punkt: lokale, warunek: {wizyta: agencja_nieruchomosci}, funkcja: siec,
         czemu: "Drugi lokal to drugi czynsz i druga załoga. Kredyt inwestycyjny dają pod zastaw."}
      - {id: swieto, tekst: "Uważajcie na tydzień ze świętem", kartka: "Tydzień ze świętem", zeton: kamienica_rachmistrzow, punkt: biuro, warunek: {wizyta: kamienica_rachmistrzow},
         czemu: "W święto nie każde biuro pracuje, a ludzie jedzą w domu."}
  10:
    tytul: "Festyn"
    zadania:
      - {id: festyn, tekst: "Zamówcie stoisko albo degustację", kartka: "Stoisko na festynie", zeton: biurowiec_zana, punkt: agencje, warunek: {kampania_trwa: kozi_grod}, element: reklama_kozi_grod, funkcja: marketing,
         czemu: "Kto raz spróbuje na festynie, ten przyjdzie do lokalu."}
      - {id: tlum, tekst: "Sprawdźcie, gdzie będzie tłum", kartka: "Gdzie będzie tłum?", zeton: ogrod_saski, punkt: zdarzenia, warunek: {wizyta: park}, element: parki,
         czemu: "Stoisko stawia się tam, gdzie są ludzie, nie tam, gdzie jest ładnie."}
  11:
    tytul: "Pełna karta"
    zadania:
      - {id: specjalne2, tekst: "Dodajcie drugie danie specjalne i napój", kartka: "Nowe dania w karcie", zeton: lokal, punkt: lokal_menu, warunek: danie_specjalne, element: danie_kebab_specjalny_2,
         czemu: "Karta jest już pełna. Teraz pilnujcie, żeby kuchnia nadążała."}
      - {id: rentownosc, tekst: "Policzcie, czy każde danie zarabia", kartka: "Które danie zarabia?", zeton: redakcja, punkt: raport, warunek: {wizyta: redakcja},
         czemu: "Danie, do którego dokładacie, zdejmijcie bez żalu."}
  12:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: koszty_stale, tekst: "Sprawdźcie koszty stałe", kartka: "Koszty stałe", zeton: redakcja, punkt: raport, warunek: {wizyta: redakcja},
         czemu: "Biuro, czynsz, raty: czy coś da się mieć taniej?"}
  13:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: kampanie, tekst: "Odświeżcie reklamę", kartka: "Wasze kampanie", zeton: biurowiec_zana, punkt: agencje, warunek: kampania_trwa, funkcja: marketing,
         czemu: "Kampania, która się skończyła, już nie pracuje."}
  14:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: zespol_grudzien, tekst: "Zadbajcie o zespół przed grudniem", kartka: "Zespół przed grudniem", zeton: galeria, punkt: hr_rozwoj, warunek: {wizyta: galeria}, funkcja: rozwoj,
         czemu: "Grudzień to najcięższy miesiąc. Kto odejdzie teraz, tego nie zastąpicie."}
  15:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: splata, tekst: "Spłaćcie najdroższy dług", kartka: "Najdroższy dług", zeton: kamienica_bankowa, punkt: bank, warunek: bez_drogiego_dlugu,
         czemu: "Najpierw to, co najdrożej kosztuje."}
  16:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: swieta, tekst: "Zaplanujcie święta", kartka: "Plan na święta", zeton: uczelnia, punkt: kalendarz, warunek: {wizyta: uczelnia}, funkcja: analiza,
         czemu: "W święta miasto zwalnia. Mniej towaru, krótszy grafik."}
  17:
    tytul: "Rutyna dobrego gospodarza"
    zadania:
      - {id: koniec, tekst: "Zdecydujcie, co zostaje na koniec", kartka: "Zapasy i długi", zeton: lokal, punkt: zaop_magazyn, warunek: {wizyta: kebab},
         czemu: "Za tydzień zamykamy rachunki. Zapasy i długi liczą się do wyniku."}
  ostatni:    # strona ostatniego tygodnia gry (v.runda === liczba_rund), niezależnie od numeru
    tytul: "Ostatni tydzień"
    list: >-
      Po tym tygodniu zamykamy rachunki sezonu. Nie zostawiajcie towaru, który się zepsuje, ani długów, które można
      spłacić. W tabeli ostatnie tygodnie ważą najwięcej, więc jeszcze wszystko może się zmienić.
    zadania:
      - {id: malo_towaru, tekst: "Zamówcie tylko tyle towaru, ile sprzedacie", kartka: "Mało towaru na koniec", zeton: makro, punkt: zaop_dostawy, warunek: towar_jest,
         czemu: "Co zostanie w chłodni, przepadnie."}
      - {id: splata_koniec, tekst: "Spłaćcie, co się da", kartka: "Spłaćcie długi", zeton: kamienica_bankowa, punkt: bank, warunek: bez_drogiego_dlugu,
         czemu: "Czysta kartka na koniec."}

# --- strony „gdzie co najlepiej kupić” ------------------------------------------------------------------------
# Zdania są stałe, a liczby i nazwy zwycięzców wstawia gra z bieżących danych (api/zeszyt.py), żeby zmiana cen nie
# rozjechała zeszytu: {najtanszy:<zasób>:<jakość>} – dostawca z najniższą ceną w bieżącym tygodniu spośród dostępnych,
# {cena:<dostawca>:<zasób>:<jakość>}, {roznica:<A>:<B>:<zasób>:<jakość>}, {dostawca:<nazwa>:<pole>}, {bank:<nazwa>:<pole>},
# {biuro:<id>:<pole>}. Strona z `od_tygodnia` przed tym tygodniem pokazuje `wczesniej` (albo tekst bez zmian).
gdzie_kupic:
  - tytul: "Pieczywo"
    tekst: "Bułki i pitę bierzcie z piekarni Koziołek ({cena:Piekarnia Koziołek:Bułka:2} zł za worek). Dowożą codziennie rano, dowóz {dostawca:Piekarnia Koziołek:koszt_dostawy} zł, a od {dostawca:Piekarnia Koziołek:darmowa_od} zł darmo. Tortille są tańsze w dyskoncie."
    zeton: piekarnia
  - tytul: "Mięso"
    tekst: "Najtaniej: {najtanszy:Mięso kebab:2}. Na opakowaniu ★★ zostaje Wam {roznica:Selgros:Zakłady Mięsne „Rożen” z Łęcznej:Mięso kebab:2} zł wobec hurtowni, ale producent bierze zamówienia od {dostawca:Zakłady Mięsne „Rożen” z Łęcznej:minimalne_zamowienie} zł."
    zeton: rozen
    od_tygodnia: {wartosc: 3, pewnosc: zalozenie, zrodlo: "szkic Fable 17.11.2026: producent mięsa otwiera zbyt w tygodniu 3 (element dostawcy_producent)"}
    wczesniej: "Do trzeciego tygodnia mięso tylko z hurtowni: najtaniej {najtanszy:Mięso kebab:2}."
  - tytul: "Warzywa, sosy, napoje"
    tekst: "Tanią i średnią jakość bierzcie z dyskontu: {najtanszy:Warzywa:2}. Wozicie sami: {dostawca:Biedronka:godziny_odbioru} godz. Waszego czasu za każdy dzień zakupów i najwyżej {dostawca:Biedronka:limit_opakowan} opakowania jednego towaru dziennie."
    zeton: biedronka
  - tytul: "Falafel i pita mrożona"
    tekst: "Tanio ma je tylko {najtanszy:Falafel mrożony:1}. Patrzcie w gazetkę."
    zeton: lidl
  - tytul: "Najlepsza jakość"
    tekst: "Dyskonty nie mają ★★★. Prawie wszystko najtaniej u: {najtanszy:Warzywa:3}; napoje: {najtanszy:Napój:3}; falafel i hummus: {najtanszy:Hummus:3}."
    zeton: eurocash
  - tytul: "Hurtownie wożą za pieniądze"
    tekst: "Selgros {dostawca:Selgros:koszt_dostawy} zł (darmo od {dostawca:Selgros:darmowa_od} zł), Makro {dostawca:Makro:koszt_dostawy} zł (od {dostawca:Makro:darmowa_od} zł), Eurocash {dostawca:Eurocash:koszt_dostawy} zł (od {dostawca:Eurocash:darmowa_od} zł). Wybierzcie jedną hurtownię na tydzień i zamówcie tyle, żeby przekroczyć próg."
    zeton: makro
  - tytul: "Sprzęt"
    tekst: "Tylko Park handlowy, sklep „Konstruktorzy T&K”. Tani sprzęt co miesiąc woła o serwis, ale przez cały sezon droższy nie zwróci się samym serwisem. Bierzcie lepszy, gdy chcecie lepszego dania. Bez gotówki: leasing w banku „Ziemia Obiecana”."
    zeton: sprzet_gastro
    tabela: sprzet   # wiersze z dane/sprzet.yaml: ceny, utrzymanie, koszt sezonu = cena + utrzymanie × liczba_rund × 12/52
  - tytul: "Konto i kredyt"
    tekst: "Najtańsze konto: Soplicowo ({bank:Soplicowo:konto} zł miesięcznie). Kredyt bez historii firmy: tylko Kmicic ({bank:Kmicic:kredyty.0.oprocentowanie} w skali roku). Duży zakup pod zastaw: Wokulski i S-ka ({bank:Wokulski i S-ka:kredyty.0.oprocentowanie}). Lokaty: Oszczędności Rzeckiego ({bank:Oszczędności Rzeckiego:lokaty.13} na 13 tygodni). Kredyt, lokatę i leasing dostaniecie tylko tam, gdzie macie konto."
    zeton: kamienica_bankowa
  - tytul: "Księgi"
    tekst: "Najtaniej u Scrooge’a ({biuro:scrooge:pakiety.M.cena} zł za pakiet M), ale w święta zamknięte i bywa, że się pomyli. J.K.Ś. ({biuro:jks:pakiety.M.cena} zł) nie myli się i ma ubezpieczenie. Asteroida 328 ({biuro:asteroida_328:pakiety.M.cena} zł) nie liczy dokumentów. Józef K. ({biuro:jozef_k:pakiety.M.cena} zł) jest tani, ale na wszystko się u niego czeka."
    zeton: kamienica_rachmistrzow

dopiski:   # „PS.” na dole strony, po jednym na tydzień (wybór po numerze tygodnia, nie z silnik/losowosc.py: to tylko wygląd)
  - "Za moich czasów leniwe były po trzy pięćdziesiąt i też się dało wyjść na swoje."
  - "Kto nie zagląda do chłodni, ten w piątek zamyka o czternastej."
  - "Gość, który czeka dłużej niż je, drugi raz nie przyjdzie."
  - "Nie wydawajcie wszystkiego naraz. Kasa lubi mieć zapas na czarną godzinę."
  - "Dobry pracownik to nie koszt, to połowa lokalu."
  - "Reklama bez towaru to zaproszenie na pusty stół."
  - "Liczcie co tydzień. Kto liczy raz w sezonie, ten liczy straty."
