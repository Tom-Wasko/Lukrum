      poniżej oczekiwanej obniża zadowolenie mocniej niż wyższa je podnosi: do składnika płacy (karta, nachylenie
      0,3162) dochodzi −kara_ponizej_oczekiwanej × (1 − pensja ÷ oczekiwana), liczone co tydzień, więc spadek trwa
      tak długo jak niska pensja i od pierwszego tygodnia (przed poprawkami 3 przy 95% oczekiwanej: −0,016 − 0,025 = −0,041,
      osoba przy sprzęcie 2★ ok. 0,89 zamiast 0,93). Boty oferują co najmniej próg. wlaczone: false – bez odrzucania, bez
      dodatkowej kary i bez progu w ofertach botów (zachowanie sprzed kalibracji). Liczby – założenie (decyzja autora:
      ok. 95%, spadek mniej więcej liniowy). Poprawki 3 (decyzja autora 8.11.2026: „mniej pieniędzy – mniej
      zadowoleni”, pensja minimalna wyraźnie gorsza): kara_ponizej_oczekiwanej 1,0 (było 0,5) – przy 95% oczekiwanej
      −0,016 − 0,05 = −0,066, osoba przy sprzęcie 2★ ma ok. 0,86 (poniżej progu odejść 0,87 i tempa 0,9)'
  szkolenia:   # kalibracja B9 (decyzja autora 7.11.2026): cena miesięczna raz, działa 4 tygodnie
    wartosc:
      wlaczone: true
      tygodni: 4
    pewnosc: zalozenie
    zrodlo: 'Kalibracja B9 (decyzja autora 7.11.2026, silnik/ludzie/szkolenia.py): szkolenie kosztuje raz cenę z
      katalogu (cena miesięczna, bez przeliczania na rundę) i działa przez tygodni tygodni od tygodnia zakupu (w grze
      tygodniowej – tyle rund). Szkolenie, które jeszcze trwa, można kupić ponownie dopiero po jego końcu.
      wlaczone: false – dawne zachowanie: cena miesięczna × 12 ÷ rund_w_roku co rundę, działa tylko w tygodniu zakupu'
  wydajnosc_z_zadowolenia:   # kalibracja B10 (decyzja autora 7.11.2026)
    wartosc:
      wlaczone: true
      prog_gorny: 1.0
      prog_dolny: 0.95
      premia: 0.05
      kara: 0.05
    pewnosc: zalozenie
    zrodlo: 'Kalibracja B10 (decyzja autora 7.11.2026, silnik/ludzie/zadowolenie.py: tempo): zadowolenie osoby z
      poprzedniego tygodnia zmienia jej tempo pracy w tym tygodniu – powyżej prog_gorny o +premia, poniżej prog_dolny
      o −kara (godziny stanowiska × mnożnik, jak cecha „szybki”/„niespieszny” ×1,1/×0,9). Umiarkowanie (±5%): badania
      nad zadowoleniem i wydajnością (Oswald, Proto, Sgroi 2015, Journal of Labor Economics: szczęśliwsi o ok. 12%
      wydajniejsi w zadaniach na czas) dają górną granicę, a w grze tempo działa naraz na całą zmianę i łączy się z
      cechą osoby. Osoba przy pensji preferowanej i sprzęcie 2★ (ok. 0,93) – bez zmiany; ze szkoleniem (od +0,076, decyzja autora 8.11.2026)
      albo przy pensji ok. 110% oczekiwanej i sprzęcie 3★ – szybciej; przy 95% oczekiwanej (ok. 0,86) albo
      przepracowana – wolniej. Nowa osoba (zadowolenie jeszcze nieznane) – bez zmiany. wlaczone: false – bez wpływu'
  podkupywanie_botow:   # kalibracja B9 (decyzja autora 7.11.2026): boty podkupują niedopłacanych
    wartosc:
      wlaczone: true
      placa_ponizej: 0.97
      zadowolenie_ponizej: 0.95
      oferta: 1.06
      oferta_maks: 1.1
      przebicie: 0.05
      na_runde: 1
      od_botow: false
    pewnosc: zalozenie
    zrodlo: 'Kalibracja B9 (decyzja autora 7.11.2026, silnik/boty.py: _podkup, silnik/ludzie/rynek_pracy.py): bot na
      poziomie z podkupuje_ludzi (boty.yaml) – tylko gdy mistrz gry pozwala podkupywać (opcja podkupywanie) i od rundy
      headhuntera – składa ofertę osobie z innej firmy (także drużyny graczy) na stanowisko, które chce obsadzić, gdy
      osoba ma pensję poniżej placa_ponizej × oczekiwana albo zadowolenie poniżej zadowolenie_ponizej (np. przyjęta
      za 95–97% oczekiwanej albo przepracowana). Oferta: obecna pensja × oferta (co najmniej pensja minimalna),
      najwyżej oczekiwana × oferta_maks; najwyżej na_runde ofert na rundę; stanowisko czeka na osobę przez okres
      wypowiedzenia. Każda oferta podkupienia (botów i drużyn) wygrywa dopiero, gdy jest o przebicie wyższa od
      obecnej pensji i od kontroferty (przy 0 – jak dotąd: wystarczy wyższa). od_botow: false – bot podkupuje tylko
      od drużyn graczy (gra samych botów na poziomie średnim, ziarna 1 i 7, 12 rund: podkupywanie bot–bot obniżało
      średnią gotówkę o ok. 14%, bo stanowisko stoi puste przez okres wypowiedzenia, a ofiara traci przeszkoloną
      osobę – boty wzajemnie się osłabiały, a celem jest kara dla drużyny, która płaci za mało); true – także od
      innych botów. wlaczone: false – boty nie podkupują, a przebicie wynosi 0. Liczby – założenie'
