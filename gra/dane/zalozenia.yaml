# Założenia (parametry mechanik)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Parametry mechanik gry, których nie widać wprost w jej interfejsie. Każdy ma: wartosc, pewnosc (potwierdzone /
  skalibrowane / zalozenie) i zrodlo. Zmiana tu zmienia działanie silnika bez zmian w kodzie. Kalibracje: pomiary botów (balans/),
  opis: dokumentacja/OPIS_GRY.md.'
popyt:
  elastycznosc_ceny:
    wartosc: 1.096
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × r^(−E1)'
  elastycznosc_wzgledem_rynku:
    wartosc: 1.0035
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × exp(−E2·(r − średnie r firm oferujących usługę)); bez tego członu błąd 9,2%'
  wykladnik_liczby_firm:
    wartosc: 0.247
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × n^(−K)'
  mnoznik_bazowy:
    wartosc: 1.498
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt roczny z instrukcji wystarcza (efekty usług nie poprawiają walidacji), brak różnicy poziomu między grami
      obu serii (różnica 3%, walidacja lepsza bez niej)'
  wspolczynniki_jakosci:
    wartosc:
      '3': 0.82
      '2': 0.654
      '1': 0.55
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      jakość = średnia ważona współczynników gwiazdek sprzętu i zasobów (lepsza od postaci liniowej w gwiazdkach);
      boty: sprzęt 2★, zasoby 1,35–1,96★ co miesiąc. Kalibracja B7 (6.11.2026): było 1★ 0,616 / 2★ 0,654 /
      3★ 1,0 – 3★ wygrywało z 2★ w 12/12 par (karta +0,25), a 2★ nie różniło się od 1★ (pomiar b7_cena); 2★ bez
      zmian (na nim stoją pule stref B5), 1★ i 3★ tak, żeby każdy krok dawał ok. +20–25% (b7_jakosc, b7_jakosc2)'
  wagi_jakosci:
    wartosc:
      pracownicy: 0.0
      sprzet: 0.407
      zasoby: 0.593
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      gwiazdki prowadzących (2,5 → 1,33 → 1,67) bez wpływu (współczynnik ≈ 0)'
  wyposazenie_na_procent_klientow:
    wartosc: 0.073
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × (1 + κ · Σ % klientów oczekujących wyposażenia / 100); wyposażenie botów (0 → 340%) odczytane z tabel
      „posiadane wyposażenie”'
  wyposazenie_nasycenie:
    wartosc: 3.0
    pewnosc: skalibrowane
    zrodlo: 'B10 (6.11.2026, b10_marketing): przy liniowym wzorze opłacała się każda sztuka – komplet 6 sztuk (430%)
      dawał +31% klientów za ok. 7 tys. zł i 420 zł utrzymania na tydzień, +0,12–0,13 karty u taniego i zrównoważonego
      (6/6). Nasycenie 1 + κ · S · (1 − e^(−x/S)) zostawia nachylenie z pomiarów przy pierwszych sztukach, a komplet
      daje ok. +17%: pierwsze 3–4 sztuki się zwracają, stoliki i telewizor – na granicy albo na minusie'
  utrata_klientow:
    wartosc: 0.0
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: utrata klientów po brakach w poprzednim miesiącu pogarsza walidację krzyżową (8,1%
      wobec 7,6%) – mechanizmu nie ma; spadek efektu firmy tłumaczy wyposażenie botów i sezonowość XI–XII'
  recepcja_1gw_mnoznik:
    wartosc: 1.0
    pewnosc: zalozenie
    zrodlo: 'wyłączone (1,0). W pomiarach: cały sprzęt kasy 1★ od października – efekt firmy spadł o ok. 15%, ale zbiega
      się z innym niewyjaśnionym spadkiem; liniowo dla 2★ psuje drugą serię pomiarów (dwie firmy z kasą 2★: błąd 1,7% →
      9,4%). Możliwy efekt tylko dla 1★ – do potwierdzenia'
  korekta_miesiaca:
    wartosc:
      styczen: 1.0
      luty: 1.0
      marzec: 0.972
      kwiecien: 0.997
      maj: 0.924
      czerwiec: 0.903
      lipiec: 0.97
      sierpien: 1.001
      wrzesien: 0.989
      pazdziernik: 0.961
      listopad: 0.808
      grudzien: 0.796
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      mnożnik ponad sezonowość z instrukcji (luty = 1). Luty–październik w granicach ±10% (sezonowość z instrukcji
      działa, inne przesunięcia miesięcy wypadają gorzej), listopad–grudzień ok. −20% u wszystkich firm. Styczeń
      bez danych'
  szum_proc:
    wartosc: 0.03
    pewnosc: zalozenie
    zrodlo: reszta modelu 4,5% zawiera błędy odczytu; losowe odchylenie popytu firmy na usługę (rozkład log-normalny,
      ziarno gry); 0 = wyłączone
  zaokraglenie:
    wartosc: do_calych_klientow
    pewnosc: zalozenie
    zrodlo: 'założenie autora: klientów zaokrągla się do całych osób'
  postac_ceny:
    wartosc: potega
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: popyt ∝ r^(−E1) (walidacja 6,3%) lepsze niż e^(−E1·(r−1)) (8,8%); r = cena po rabacie
      / cena preferowana'
reklama:
  tradycyjna_nasycenie_k:
    wartosc: 2.2166
    pewnosc: skalibrowane
    zrodlo: kalibracja pomiarami; wzrost = Σ_media A_kategorii · zasięg · ln(1 + k · emisje)
  tradycyjna_maks_kategorii:
    wartosc:
      billboard_ulotki: 0.011492
      prasa: 0.034957
      radio: 0.029501
      telewizja: 0.053354
    pewnosc: skalibrowane
    zrodlo: kalibracja pomiarami; A_kategorii (mnożone przez zasięg w % i ln(1 + k·emisje)); dopasowanie 0,15 pkt
      proc. na 8 miesiącach pomiarów
  internetowa_a:
    wartosc: 0.1898
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: pomiary czerwiec–grudzień; wzrost = a · (n / (n + c·(N − n)))^b, n – narzędzia
      firmy, N – aktywne narzędzia wszystkich firm; walidacja „zostaw miesiąc” 0,21 pkt proc. (sam udział n/N: 0,46)'
  internetowa_b:
    wartosc: 2.7561
    pewnosc: skalibrowane
    zrodlo: jw.
  sposob_laczenia:
    wartosc: suma
    pewnosc: zalozenie
    zrodlo: popyt × (1 + wzrost tradycyjna + wzrost internetowa); gra raportuje oba wzrosty osobno
  tradycyjna_postac:
    wartosc: log
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: 7 postaci porównanych walidacją „zostaw miesiąc” na 8 miesiącach pomiarów: ln(1 + k·emisje)
      w każdym medium 3,0 pkt proc., nasycenie wykładnicze 4,3, hiperbola 5,4, potęga 3,8, nasycenie sumy kategorii
      11,0, liniowo 12,0'
  internetowa_waga_konkurencji:
    wartosc: 0.3971
    pewnosc: skalibrowane
    zrodlo: jw.; narzędzie konkurenta waży ok. 0,4 własnego
operacje:
  godziny_pracownika:
    wartosc: 40
    pewnosc: zalozenie
    zrodlo: 'F2.7: etat 40 h w tygodniu (runda = tydzień), czyli 160 h w miesiącu'
  godziny_sprzetu:
    wartosc: 40
    pewnosc: zalozenie
    zrodlo: 'F2.7: jak etat – 40 h sprzętu w tygodniu (160 h w miesiącu)'
  niskie_obciazenie:
    wartosc: 0.5
    pewnosc: zalozenie
    zrodlo: 'Poprawki 2 (sprawy 17/18, 7.11.2026): wskaźnik czasu pracy osoby w Ludzie ▸ Zespół (wyniki) – poniżej tej
      części dostępnych godzin osoba ma dużo wolnego czasu (łuk niebieski); od progu przepracowania karty wyników
      (zadowolenie_osoby.wspolczynniki.prog_przepracowania) – pomarańczowy, pomiędzy – zielony'
  czas_wlasciciela:
    wartosc: 20
    pewnosc: zalozenie
    zrodlo: 'F3a.7: godziny właściciela na rundę (tydzień) na sprawy poza lokalem – odbiór osobisty w dyskontach,
      później pracuj.pl i parki; nie zależy od liczby osób w drużynie (firma ma jednego właściciela)'
  zajecia_zaokraglane_w_gore:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'założenie autora: zajęcia liczy się w pełnych godzinach, w górę'
  model_stanowisk:
    wartosc: pula
    pewnosc: skalibrowane
    zrodlo: 'pomiary: dwie firmy (luty i marzec) prowadziły usługi, których sprzęt stał na nieobsadzonych
      stanowiskach; obłożenie sprzętu = godziny zajęć / (sztuki × 160 h), wykorzystanie prowadzących = godziny wszystkich
      usług zawodu / (osoby × 160 h) – co do 0,1 pkt proc. „stanowisko” = dawne założenie (sprzęt i prowadzący na
      tym samym stanowisku)'
  kolejnosc_obslugi:
    wartosc: proporcjonalnie
    pewnosc: zalozenie
    zrodlo: przy braku mocy przerobowych klienci usług na stanowisku obsługiwani proporcjonalnie do popytu
  braki_wykladnik_godzin:
    wartosc: -1.55
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: przy braku zasobu obsłużeni ∝ popyt · (godziny zajęć)^α (pomiar z kwietnia – brak płynu,
      grudzień – brak napoju): błąd 19% wobec 32% przy podziale proporcjonalnym; cena, grupa i popyt nie poprawiają
      dopasowania'
finanse:
  kapital_startowy:
    wartosc: 50000
    pewnosc: zalozenie
    zrodlo: 'decyzja autora 13.11.2026 (tor A): kapitał startowy 50 000 zł – tyle, żeby wystarczyło na najem lokalu, sprzęt, pierwszą ekipę i zapas na pierwsze tygodnie; mistrz gry może go zmienić'
  placa_minimalna:
    wartosc: 4806
    pewnosc: potwierdzone
    zrodlo: 'rozporządzenie Rady Ministrów: płaca minimalna od 1.01.2026 (4806 zł brutto)'
  zus_pracodawcy:
    wartosc: 0.19
    pewnosc: zalozenie
    zrodlo: 'założenie autora: składki pracodawcy w przybliżeniu 19% płacy brutto'
  amortyzacja_prog:
    wartosc: 10000
    pewnosc: potwierdzone
    zrodlo: 'ustawa o PIT: próg środka trwałego 10 000 zł, poniżej – od razu w koszty'
  amortyzacja_niskocenna:
    wartosc:
      wybor: true    # false – gracz nie wybiera, zakupy poniżej progu zawsze w koszty
      stawka: 0.2    # roczna stawka amortyzacji zakupów poniżej progu, gdy firma je amortyzuje
    pewnosc: zalozenie
    zrodlo: 'B6 (decyzja autora 7.11.2026, propozycja 1): gracz wybiera (Księgowość ▸ Biuro rachunkowe), czy zakupy
      poniżej amortyzacja_prog (sprzęt, wyposażenie, stanowiska, sprzęt w cenie lokalu) idą od razu w koszty (domyślnie,
      boty), czy do ewidencji z amortyzacją `stawka` rocznie (art. 22d ust. 1 ustawy o PIT – niskocenne środki trwałe
      do 10 000 zł: jednorazowo w koszty albo amortyzacja; 20% – stawka sprzętu gastronomicznego jak amortyzacja_roczna.sprzet).
      wybor: false – opcja wyłączona, wszystko w koszty (jak przed 7.11)'
  amortyzacja_powyzej_progu_miesiecznie:
    wartosc: 0.1
    pewnosc: zalozenie
    zrodlo: 'założenie autora: 10%; nie wiadomo, czy miesięcznie – w pomiarach brak sprzętu powyżej 10 000 zł'
  amortyzacja_roczna:
    wartosc:
      lokal: 0.025
      budynek: 0.025
      grunt: 0
      sprzet: 0.2
      wyposazenie: 0.2
    pewnosc: zalozenie
    zrodlo: 'gra z lokalami (F3a.6): stawki roczne jak w wykazie stawek amortyzacyjnych – budynki i lokale niemieszkalne
      2,5%, grunt bez amortyzacji, sprzęt i wyposażenie 20%; amortyzacja liniowa co rundę'
  sprzedaz_sprzetu:
    wartosc: 0.5
    pewnosc: skalibrowane
    zrodlo: 'sprzedaż sprzętu r9: ≈ 50% ceny, w dół do 10 PLN'
  sprzedaz_udogodnien:
    wartosc: 0.5
    pewnosc: zalozenie
    zrodlo: 'założenie autora: sprzęt sprzedaje się za połowę ceny zakupu'
  lokata_odsetki:
    wartosc: proste_miesieczne
    pewnosc: zalozenie
    zrodlo: założenie autora (odsetki proste, naliczane co rundę)
  kredyt_odsetki:
    wartosc: proste_miesieczne
    pewnosc: zalozenie
    zrodlo: 'założenie autora: odsetki proste, np. 100 zł na 1 miesiąc przy 10% rocznie to 0,83 zł'
  kredyt_odnawialny_automatyczny:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'założenie autora: kredyt odnawia się sam, dopóki gracz go nie spłaci'
  inwestor_ratunkowy:
    wartosc:
      max_kwota: 40000
      udzial: 0.3
      rund: 8
    pewnosc: zalozenie
    zrodlo: 'Z3 (Plan optymalizacji, odpowiedź autora: „Inwestor za udział w wyniku”, „Wpłata jako dług”): mistrz gry
      ratuje drużynę z debetem ponad limit wpłatą do max_kwota (kapitał startowy); inwestor przez `rund` rund bierze
      `udzial` dodatniego dochodu netto rundy, a niezwrócona wpłata liczy się jak dług – wartości do kalibracji'
wynik:   # wynik punktowy: pięć działów po 0–200 pkt, tydzień 1 to „Wielkie otwarcie” (silnik/wyniki/punkty.py)
  mandaty_w_dochodzie:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'mandaty rundy (skarbowe za deklaracje, z błędu biura bez OC, sanepidu) i odsetki Harpagona obniżają dochód
      tygodnia, który liczy dział „Finanse”; KPiR i podatki bez zmian. false – wynik liczy dochód z KPiR'
  dzialy:
    wartosc:
      finanse:
        nazwa: Finanse
        opis: Ile firma zarabia w tygodniu i ile z każdej złotówki sprzedaży zostaje po kosztach.
        skladniki:
          dochod:
            nazwa: Dochód netto tygodnia
            jednostka: zł
            podpowiedz: Sprzedawaj więcej i z rozsądną marżą, pilnuj kosztów stałych.
            progi: [[-3000, 0], [0, 20], [3000, 60], [6000, 105], [10000, 140]]
            ponad: {za: 1000, pkt: 10, maks: 40}
          marza:
            nazwa: Marża (dochód ÷ przychód)
            jednostka: udział
            podpowiedz: Wysoka marża to dobre ceny przy rozsądnych kosztach towaru i płac.
            progi: [[-0.2, 0], [0, 15], [0.1, 35], [0.2, 50], [0.3, 60]]
            ponad: {za: 0.1, pkt: 8, maks: 20}
      goscie:
        nazwa: Goście
        opis: Czy goście dostają to, po co przyszli, i ilu ich jest.
        skladniki:
          zadowolenie:
            nazwa: Zadowolenie gości (0–100)
            jednostka: pkt
            podpowiedz: Dobre składniki i obsługa, uczciwa cena, bez kolejek, braków dań i pomyłek.
            progi: [[30, 0], [60, 40], [80, 70], [95, 80]]
          obsluzeni:
            nazwa: Obsłużeni z chętnych
            jednostka: udział
            podpowiedz: Więcej rąk, sprzętu i towaru na szczyt, żeby nikt nie odchodził z kolejki.
            progi: [[0.4, 0], [0.7, 35], [0.9, 60], [1.0, 70]]
          liczba:
            nazwa: Liczba obsłużonych gości
            jednostka: osób
            podpowiedz: Dobry lokal, reklama i cena przyciągają tłum, ale trzeba go obsłużyć.
            progi: [[200, 0], [1000, 25], [2000, 50]]
            ponad: {za: 400, pkt: 8, maks: 30}
      zespol:
        nazwa: Zespół
        opis: Jak się pracuje w firmie – nastrój, obciążenie, szkolenia i udogodnienia.
        skladniki:
          nastroj:
            nazwa: Zadowolenie zespołu
            jednostka: wskaźnik
            podpowiedz: Uczciwe pensje, dobry sprzęt, umowa o pracę, szkolenia i odpowiednie obciążenie.
            progi: [[0.85, 0], [0.95, 40], [1.02, 85], [1.12, 110]]
          przepracowanie:
            nazwa: Przepracowanie
            jednostka: udział
            podpowiedz: Każdy, kto pracuje ponad próg obciążenia, traci siły. Zatrudnij kogoś albo rozłóż pracę.
            progi: [[0, 40], [0.1, 20], [0.2, 0]]
          szkolenia:
            nazwa: Szkolenia w tym tygodniu
            jednostka: udział
            podpowiedz: Szkolenie działa tydzień po tygodniu, więc opłaca się je powtarzać.
            progi: [[0, 0], [0.9, 30]]
          udogodnienia:
            nazwa: Udogodnienia i socjal
            jednostka: wskaźnik
            podpowiedz: Hojny socjal może dać więcej niż 20 pkt, ale kosztuje co tydzień.
            progi: [[0, 0], [1, 20]]
            ponad: {za: 1, pkt: 10, maks: 30}
      rozwoj:
        nazwa: Rozwój
        opis: Majątek, kolejne lokale, szersze menu i większa załoga.
        skladniki:
          majatek:
            nazwa: Majątek trwały
            jednostka: zł
            podpowiedz: Sprzęt, wyposażenie i kupione nieruchomości (wartość po amortyzacji).
            progi: [[0, 0], [5000, 40], [15000, 80]]
            ponad: {za: 10000, pkt: 10, maks: 30}
          lokale:
            nazwa: Liczba lokali
            jednostka: lokali
            podpowiedz: Każdy kolejny lokal to nowy rynek, ale i nowe koszty.
            progi: [[0, 0], [1, 20], [2, 40], [3, 50]]
            ponad: {za: 1, pkt: 10, maks: 30}
          menu:
            nazwa: Dania w menu
            jednostka: dań
            podpowiedz: Szersze menu przyciąga więcej gości, o ile starcza składników i rąk.
            progi: [[0, 0], [3, 15], [6, 30], [9, 40]]
          zaloga:
            nazwa: Wielkość załogi
            jednostka: osób
            podpowiedz: Zespół, który się rozrasta razem z lokalem.
            progi: [[0, 0], [3, 15], [6, 30]]
      bezpieczenstwo:
        nazwa: Bezpieczeństwo finansowe
        opis: Czy firma przetrwa gorszy tydzień – zapas gotówki, mało długów, brak zaległości.
        skladniki:
          zapas:
            nazwa: Zapas gotówki (tygodnie kosztów)
            jednostka: tygodni
            podpowiedz: Trzymaj w kasie równowartość kilku tygodni kosztów.
            progi: [[0, 0], [1, 25], [3, 60], [6, 95], [10, 120]]
            ponad: {za: 5, pkt: 10, maks: 30}
          kapital:
