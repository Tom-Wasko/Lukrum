    zrodlo: 'Kalibracja B9 (decyzja autora 7.11.2026, silnik/ludzie/formy.py: prog_oferty, silnik/ludzie/zadowolenie.py):
      kandydat z rynku pracy odrzuca ofertę niższą niż prog_odrzucenia × pensja oczekiwana w tej formie (pół etatu,
