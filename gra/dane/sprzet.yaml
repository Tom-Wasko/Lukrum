# Sprzęt
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Sprzęt stanowisk: typ stanowiska (kuchnia – kucharz, kasa – kasjer), ceny w 3 jakościach, utrzymanie miesięczne.
  Do F2.7 sprzęt kupuje się na stanowisko. Szafa chłodnicza i zamrażarka (gra z lokalami, F3a.5) nie są
  potrzebne do żadnego dania – dają miejsce w chłodni i zamrażarce firmy (pojemnosc_l w litrach).
  Każda jakość to wybór z kosztem: ★ tanio na start, ale droższe utrzymanie (serwis, awarie) i słabsze dania;
  ★★ rozsądny środek; ★★★ wyraźnie droższe (ok. 2,2–2,5 razy ★★), zwraca się dopiero przy dużym ruchu.'
zrodlo: 'przeliczone od zera 15.11.2026 (decyzja autora 14.11: priorytet ma rozgrywka, nie odwzorowanie rynku; każda
  jakość to wybór z kosztem). Zwrot dopłaty liczony na efekcie z silnika: jakość sprzętu ma wagę 0,4 w jakości dania,
  współczynniki gwiazdek 0,52 / 0,65 / 0,83 (zalozenia.yaml: popyt), czyli ★→★★ daje ok. +9% popytu na dania na tym
  sprzęcie, ★★→★★★ ok. +11%; marża tygodniowa dań na jednej sztuce: rożen ok. 3 500 zł, frytownica ok. 2 800 zł,
  lodówka ok. 900 zł. Zwrot dopłaty względem ★: ok. 5–6 tyg.; ★★★ względem ★★: ok. 11–18 tyg. (zależnie od sprzętu)'
