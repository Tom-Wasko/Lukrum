    od_rundy: 12
    opis: 'Świeci na różowo nad zmywakiem. Nikt nie wie po co, wszyscy robią sobie przy nim zdjęcia.'
  - nazwa: Akwarium z rybkami
    procent: 15
    cena: 1300
    utrzymanie: 40
    od_rundy: 13
    opis: 'Patrzenie na rybki uspokaja – nawet w piątek o 23:00, gdy kolejka sięga drzwi.'
  - nazwa: Hamak na zapleczu
