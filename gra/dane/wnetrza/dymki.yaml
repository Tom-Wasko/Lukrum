# Dymki przy ladzie (decyzje autora 13.11.2026, notatka „Wygląd” w repo Lukrum-notatki)
# Klienci i bywalcy (bywalcy.yaml) mówią w dymkach to, co policzył silnik w ostatniej rundzie. Silnik: silnik/wnetrza/.
# Sprawdzenie: python -m silnik.dane sprawdz
#
# Cztery rodzaje dymków. Każdy włącza i wyłącza mistrz gry (ustawienia gry) i gracz u siebie (filtr w panelu).
# Pola dymka:
#   rodzaj: cena_smak | plotki | propozycje | wos
#   kto: id bywalca, „gosc” (anonimowy klient) albo „kazdy” (bywalec albo gość)
#   gdy: warunki na wskaźniki, {wskaznik: {od: x, do: y}}. `od` włącznie, `do` wyłącznie. Brak warunków = zawsze
#   zrodlo (plotki): park | kalendarz | konkurencja. Skąd brać {park}/{tytul}, {wydarzenie}, {konkurent}/{dzielnica}
#   okazja (wujek): start | pierwsza_strata | rekord | ostatnia_runda
#   tekst: treść dymka. Pola {cena}, {cena_strefy}, {ocena}, {zmiana_ceny} wstawia silnik
#   wyjasnienie, zrodlo_prawne, sprawdzone (wos): krótka odpowiedź pod dymkiem. sprawdzone: false = do sprawdzenia
#     przez autora przed lekcją
#   Propozycje (rodzaj „propozycje”) mają osobną listę `propozycje` z odpowiedziami i skutkami, niżej.
opis: 'Co rundę przy ladzie staje kilku gości. Ich dymki to wyniki silnika powiedziane ludzkim głosem.'

zasady:
  dymkow_na_runde: [3, 6]       # ile dymków losuje silnik na rundę (przed filtrami rodzajów)
  udzial_bywalcow: 0.5          # szansa, że dymek z „kazdy” powie bywalec, a nie anonimowy gość
  bywalec_co_rund: 2            # ten sam bywalec najwyżej raz na tyle rund (wujek nie liczy się do tej zasady)
  wos_na_runde: 1               # najwyżej tyle zaczepek WOS na rundę, żeby nie zasypać lady lekcją

rodzaje:
  cena_smak: {nazwa: Opinie o cenie i smaku}
  plotki: {nazwa: Plotki z miasta}
  propozycje: {nazwa: Propozycje i kłopoty}
  wos: {nazwa: Zaczepki WOS}

# Wskaźniki liczy silnik z ostatniej rundy lokalu. Nazwy tutaj są umową z silnikiem.
wskazniki:
  cena_wzgledem_strefy: 'średnia cena dań w menu ÷ cena strefy (1,0 = jak w okolicy)'
  zmiana_ceny: 'zmiana średniej ceny dań od poprzedniej rundy, w procentach (np. −10, +15)'
  ocena: 'ocena lokalu, 1–5 gwiazdek (brak opinii = warunek niespełniony)'
  kolejka: 'udział klientów, którzy odeszli z kolejki (0–1)'
  brak_dan: 'udział klientów, którzy odeszli, bo zabrakło dania lub składnika (0–1)'
  nastroj_zespolu: 'średni nastrój pracowników lokalu, 0–100'
  runda: 'numer rundy'

dymki:
# ── Opinie o cenie i smaku ──────────────────────────────────────────────────────────────────────────────────────────
- rodzaj: cena_smak
  kto: rzecki
  gdy: {cena_wzgledem_strefy: {od: 1.15}}
  tekst: 'Zapisuję w pamiętniku: porcja po {cena} zł, a w okolicy płaci się {cena_strefy}. Zanotowano z żalem.'
- rodzaj: cena_smak
  kto: rzecki
  gdy: {zmiana_ceny: {od: 5}}
  tekst: 'W zeszłym tygodniu było taniej o {zmiana_ceny}%. Ja wszystko pamiętam, proszę państwa. Wszystko.'
- rodzaj: cena_smak
  kto: rzecki
  gdy: {zmiana_ceny: {do: -5}}
  tekst: 'Obniżka! Za mojej pamięci zdarzało się to rzadziej niż kometa. Kupuję dwie porcje, na zapas.'
- rodzaj: cena_smak
  kto: rzecki
  gdy: {cena_wzgledem_strefy: {od: 0.9, do: 1.15}}
  tekst: 'Cena uczciwa, porcja uczciwa. Tak się prowadzi sklep. Znaczy… lokal.'

- rodzaj: cena_smak
  kto: zagloba
  gdy: {ocena: {od: 4.3}}
  tekst: 'Na uczcie u księcia jadłem gorzej, a wierzcie mi, bywałem na niejednej! Mięso jak marzenie!'
- rodzaj: cena_smak
  kto: zagloba
  gdy: {ocena: {do: 3.0}}
  tekst: 'Mości kucharzu, toż to podeszwa, nie mięso! Ja bym takim kebabem nie poczęstował nawet Tatarzyna!'
- rodzaj: cena_smak
  kto: zagloba
  gdy: {brak_dan: {od: 0.05}}
  tekst: 'Przychodzę głodny jak wilk, a tu „nie ma, skończyło się”! Zapasy, mości panowie, zapasy to podstawa!'

- rodzaj: cena_smak
  kto: jozio
  gdy: {cena_wzgledem_strefy: {od: 1.2}}
  tekst: 'Za {cena} zł? Ziomki się ze mnie śmieją, że przepłacam. Nie dam sobie przyprawić gęby frajera.'
- rodzaj: cena_smak
  kto: jozio
  gdy: {ocena: {od: 4.0}}
  tekst: 'Wrzuciłem story stąd i nikt nie napisał „cringe”. To prawie jak pięć gwiazdek.'

- rodzaj: cena_smak
  kto: dulska
  gdy: {kolejka: {od: 0.1}}
  tekst: 'Stałam w kolejce jak za mięsem w osiemdziesiątym pierwszym. Co ludzie powiedzą, że ja tu czekam?'

- rodzaj: cena_smak
  kto: gosc
  gdy: {cena_wzgledem_strefy: {od: 1.15}}
  tekst: 'Za {cena} zł? U konkurencji dają za {cena_strefy}…'
- rodzaj: cena_smak
  kto: gosc
  gdy: {cena_wzgledem_strefy: {do: 0.85}}
  tekst: 'Tak tanio? Coś musi być nie tak z tym mięsem… Ale dobra, biorę.'
- rodzaj: cena_smak
  kto: gosc
  gdy: {ocena: {od: 4.2}}
  tekst: 'Najlepszy sos w mieście. Mówię to każdemu, kto chce słuchać, i paru, którzy nie chcą.'
- rodzaj: cena_smak
  kto: gosc
  gdy: {ocena: {do: 3.0}}
  tekst: 'Bułka czerstwa, mięso letnie. Następnym razem idę gdzie indziej.'
- rodzaj: cena_smak
  kto: gosc
  gdy: {kolejka: {od: 0.15}}
  tekst: 'Dwadzieścia minut w kolejce! Mam przerwę tylko pół godziny.'
- rodzaj: cena_smak
  kto: gosc
  gdy: {brak_dan: {od: 0.05}}
  tekst: 'Jak to nie ma falafela? Przecież wisi w menu!'
- rodzaj: cena_smak
  kto: gosc
  tekst: 'Poproszę to samo co zawsze. Pani przy ladzie już wie.'

- rodzaj: cena_smak
  kto: judym
  gdy: {nastroj_zespolu: {do: 40}}
  tekst: 'Pani przy ladzie ledwo stoi na nogach. Jako lekarz mówię: zmęczony pracownik to pomyłki i oparzenia.'
- rodzaj: cena_smak
  kto: judym
  gdy: {nastroj_zespolu: {od: 75}}
  tekst: 'Uśmiechnięta obsługa to rzadki widok. Widać, że tu się dba o ludzi, nie tylko o utarg.'

# ── Cytaty z lektur (decyzja autora 13.11: humor + prawdziwe cytaty; brzmienie sprawdzić w Wolnych Lekturach) ─────
# cytat: fragment w cudzysłowie to dosłowny cytat; cytat_zrodlo: skąd i w jakim stanie jest sprawdzenie
- rodzaj: cena_smak
  kto: dulska
  gdy: {ocena: {do: 3.0}}
  tekst: 'Smakowało średnio, ale nikomu nie powiem. „Na to mamy cztery ściany i sufit, aby brudy swoje prać w domu”.'
  cytat: true
  cytat_zrodlo: 'Zapolska, Moralność pani Dulskiej; brzmienie za zpe.gov.pl i opracowaniami, do porównania z Wolnymi Lekturami'
- rodzaj: cena_smak
  kto: zagloba
  gdy: {ocena: {od: 4.0}}
  tekst: '„Mości panowie! gdybym zaczął wszystko szczegółowie opowiadać, tedy i dziesięciu nocy by nie starczyło”. Krótko: dobry kebab!'
  cytat: true
  cytat_zrodlo: 'Sienkiewicz, Ogniem i mieczem; brzmienie za quizem wprost.pl, do porównania z Wolnymi Lekturami'
- rodzaj: cena_smak
  kto: zagloba
  gdy: {kolejka: {od: 0.15}}
  tekst: 'Tyle czekać na jedną porcję? „Zdechnę ja i pchły moje!”'
  cytat: true
  cytat_zrodlo: 'Sienkiewicz, Trylogia; za artykułem w Folia Linguistica (UŁ), do porównania z Wolnymi Lekturami'
- rodzaj: cena_smak
  kto: papkin
  gdy: {cena_wzgledem_strefy: {od: 1.15}}
  tekst: 'Za {cena} zł? „Jeśli nie chcesz mojej zguby, krokodyla daj mi, luby”. Albo chociaż rabat.'
  cytat: true
  cytat_zrodlo: 'Fredro, Zemsta; w źródłach są dwie wersje („daj mi” / „kup mi”), sprawdzić w Wolnych Lekturach'
- rodzaj: cena_smak
  kto: rzecki
  gdy: {zmiana_ceny: {od: 10}}
  tekst: 'Ceny rosną jak gwiazda Napoleonów. Ale i ta gwiazda kiedyś zgasła pod Sedanem.'
  cytat: false
  cytat_zrodlo: 'aluzja do Lalki (Rzecki i Bonapartowie), nie dosłowny cytat'

# ── Plotki z miasta ─────────────────────────────────────────────────────────────────────────────────────────────────
- rodzaj: plotki
  kto: dulska
  zrodlo: park
  tekst: 'Pani słyszała? W parku {park} ma być „{tytul}”. Ja tam nie pójdę, ale wszyscy będą gadać.'
- rodzaj: plotki
  kto: papkin
  zrodlo: park
  tekst: 'Ja, lew Północy, osobiście biorę udział w „{tytul}” w parku {park}. Załatwię wam tam stoisko. Prawie na pewno.'
- rodzaj: plotki
  kto: gosc
  zrodlo: kalendarz
  tekst: 'Za tydzień {wydarzenie}. Cały Lublin wyjdzie na miasto, przygotujcie więcej mięsa.'
- rodzaj: plotki
  kto: dulska
  zrodlo: konkurencja
  tekst: 'Na {dzielnica} otworzyli nowy kebab, „{konkurent}”. Byłam, oczywiście tylko popatrzeć. Brudno.'
- rodzaj: plotki
  kto: gosc
  zrodlo: konkurencja
  tekst: 'Znajomi chwalą „{konkurent}”. Podobno tańszy. Ja tam zostaję przy was, na razie.'
- rodzaj: plotki
  kto: papkin
  tekst: 'Znam szefa największej hurtowni na Tatarach. Powie wam, kiedy mięso stanieje. Za drobną przysługę, rzecz jasna.'
- rodzaj: plotki
  kto: jozio
  tekst: 'U nas w szkole mówią, że na Krakowskim to tylko turyści jedzą. Ale my i tak przychodzimy, bo blisko.'

# ── Zaczepki WOS (jedno pytanie i krótka odpowiedź) ─────────────────────────────────────────────────────────────────
# Sprawdzone przez Claude 14.11.2026 w opracowaniach i tekstach przepisów (pole `sprawdzil`). Do gry wchodzą dopiero
# po zatwierdzeniu przez autora (`sprawdzone: true`).
- rodzaj: wos
  kto: jozio
  tekst: 'A paragon będzie? Bo mama mówi, że jak nie ma paragonu, to coś jest nie tak.'
  wyjasnienie: 'Sprzedawca z kasą fiskalną musi przy każdej sprzedaży wydrukować i wydać paragon, nawet gdy klient o niego nie prosi. Za zgodą klienta może to być e-paragon.'
  zrodlo_prawne: 'ustawa o VAT, art. 111 ust. 3a pkt 1'
  sprawdzil: 'Claude 14.11: obowiązek wydania bez żądania potwierdza orzecznictwo NSA (infor.pl, ifirma.pl); e-paragon za zgodą od 2020'
  sprawdzone: false
- rodzaj: wos
  kto: zagloba
  tekst: 'Czy w tym sosie są orzechy? Mam uczulenie, a wolę zginąć w bitwie niż od sosu.'
  wyjasnienie: 'Lokal musi informować o 14 alergenach z unijnej listy (m.in. orzechy, gluten, mleko, sezam) także przy daniach bez opakowania, podawanych na miejscu.'
  zrodlo_prawne: 'rozporządzenie (UE) nr 1169/2011, art. 44 ust. 1 lit. a i załącznik II'
  sprawdzil: 'Claude 14.11: komunikat Komisji 2017/C 428/01, kary UOKiK/IH za brak informacji w gastronomii. Forma (ustnie czy na piśmie) zależy od przepisów krajowych, dlatego w tekście jej nie podajemy'
  sprawdzone: false
- rodzaj: wos
  kto: rzecki
  tekst: 'Czy ta cena w menu jest z podatkiem? Bo ja liczę co do grosza.'
  wyjasnienie: 'Cena dla klienta zawsze zawiera VAT (jest brutto). Klient płaci dokładnie tyle, ile widzi w menu.'
  zrodlo_prawne: 'ustawa z 9 maja 2014 r. o informowaniu o cenach towarów i usług, art. 3 ust. 1 pkt 1'
  sprawdzil: 'Claude 14.11: definicja ceny obejmuje podatek od towarów i usług (z pamięci, numer punktu do potwierdzenia w ISAP)'
  sprawdzone: false
- rodzaj: wos
  kto: gosc
  tekst: 'Kebab był zimny. Mogę to zareklamować, czy już po ptakach?'
  wyjasnienie: 'Można złożyć reklamację. Firma ma 14 dni od jej otrzymania na odpowiedź. Jeśli nie odpowie w terminie, uznaje się, że reklamację przyjęła.'
  zrodlo_prawne: 'ustawa o prawach konsumenta, art. 7a'
  sprawdzil: 'Claude 14.11: termin skrócony z 30 do 14 dni nowelizacją (Senat, druk 830); skutek milczenia potwierdzają poradniki (ifirma.pl, poradnikprzedsiebiorcy.pl)'
  sprawdzone: false
- rodzaj: wos
  kto: jozio
  tekst: 'Mam szesnaście lat. Mogę tu dorobić w wakacje?'
  wyjasnienie: 'Tak, ale tylko przy lekkich pracach i po badaniu lekarskim. W wakacje najwyżej 7 godzin dziennie i 35 w tygodniu, bez nadgodzin i nie w nocy (22–6).'
  zrodlo_prawne: 'Kodeks pracy, art. 200¹, 200², 201 i 203'
  sprawdzil: 'Claude 14.11: limity wakacyjne 7 h / 35 h (art. 200² § 3), zakaz nadgodzin i pracy nocnej (art. 203), badania (art. 201) – opracowania infor.pl i PIP'
  sprawdzone: false
- rodzaj: wos
  kto: judym
  tekst: 'Widzę kamerę nad kasą. Pracownicy wiedzą, że są nagrywani?'
  wyjasnienie: 'Muszą wiedzieć. Pracodawca informuje o monitoringu najpóźniej 2 tygodnie przed jego uruchomieniem, określa jego cel i oznacza nagrywany teren.'
  zrodlo_prawne: 'Kodeks pracy, art. 22² i RODO (art. 13)'
  sprawdzil: 'Claude 14.11: termin 2 tygodni i oznaczenie – opracowania (ifirma.pl, poradnikprzedsiebiorcy.pl); numery paragrafów różnią się w źródłach, dlatego podajemy sam artykuł'
  sprawdzone: false
- rodzaj: wos
  kto: gosc
  tekst: 'Płacę kartą, dobrze? Nie mam przy sobie gotówki.'
  wyjasnienie: 'Firma musi dać klientowi możliwość zapłaty bezgotówkowej, np. kartą albo BLIK-iem. Od 2025 r. kasa fiskalna musi być połączona z terminalem płatniczym.'
  zrodlo_prawne: 'Prawo przedsiębiorców, art. 19a (ust. 1 od 2022 r., ust. 3 od 2025 r.)'
  sprawdzil: 'Claude 14.11: rp.pl, infor.pl, prawnik.cc. Zakres (czy dotyczy wszystkich, czy tylko firm z kasą) do potwierdzenia w ISAP'
  sprawdzone: false
- rodzaj: wos
  kto: papkin
  tekst: 'Zapłacę jutro, słowo lwa Północy! Albo zapiszcie mi to na zeszyt.'
  wyjasnienie: '„Na zeszyt” to odroczona płatność, czyli kredyt dla klienta. Ryzyko, że pieniądze nie wrócą, ponosi sprzedawca, a sprzedaż i tak trzeba zarejestrować na kasie w chwili wydania jedzenia.'
  zrodlo_prawne: 'Kodeks cywilny, art. 535 (umowa sprzedaży); ustawa o VAT, art. 111 (ewidencja na kasie)'
  sprawdzil: 'Claude 14.11: zasada ogólna, bez osobnego źródła. Moment ewidencji na kasie do potwierdzenia w rozporządzeniu w sprawie kas rejestrujących'
  sprawdzone: false

# ── Wujek (specjalny: tylko w ważnych momentach, rodzaj cena_smak, żeby nie zniknął przy filtrach) ──────────────────
- rodzaj: cena_smak
  kto: wujek
  okazja: start
  tekst: 'No to klucze są wasze. Za Gierka kolejka stała do samego rogu. Zobaczymy, ile wy postoicie.'
- rodzaj: cena_smak
  kto: wujek
  okazja: pierwsza_strata
  tekst: 'Pierwszy tydzień na minusie? Ja miałem takich dziesięć z rzędu. Głowa do góry i liczyć, liczyć.'
- rodzaj: cena_smak
  kto: wujek
  okazja: rekord
  tekst: 'Taki utarg? Za moich czasów to by mi milicja przyszła sprawdzić, skąd tyle. Gratuluję, naprawdę.'
- rodzaj: cena_smak
  kto: wujek
  okazja: ostatnia_runda
  tekst: 'Ostatni tydzień. Cokolwiek wyjdzie w rachunkach, lokal żyje. A to więcej, niż ja potrafiłem.'

# ── Propozycje i kłopoty (decyzja autora 13.11: 2–3 odpowiedzi z prawdziwym skutkiem, najwyżej jedna na kilka rund) ──
# Pola propozycji: id, kto, od_rundy, gdy, tekst, odpowiedzi [{id, tekst, reakcja, skutki, szansa, skutki_porazka}].
# Skutki (słownik, wszystko opcjonalne; liczy silnik w rundzie po odpowiedzi):
#   porcje: dodatkowa sprzedaż, przychód = porcje × średnia cena menu × (1 − rabat), składniki wg receptur
#   rabat: 0–1, upust od ceny menu dla tych porcji
#   darmowe_porcje: porcje na koszt firmy (tylko składniki, bez przychodu)
#   koszt: jednorazowy wydatek w zł (brutto)
#   opinia: zmiana oceny lokalu w gwiazdkach na następną rundę (np. 0.1)
#   ryzyko_kontroli: dodatek do szansy kontroli sanepidu w następnej rundzie (zalozenia.yaml magazyn.sanepid)
#   kandydat: true – osoba trafia do puli kandydatów bez kosztu ogłoszenia
# szansa: prawdopodobieństwo, że wyjdzie `skutki`; inaczej `skutki_porazka` (brak pola = zawsze `skutki`)
# Liczby to założenia (pewnosc: zalozenie) do sprawdzenia po grze testowej.
propozycje_zasady:
  co_ile_rund: {wartosc: 3, pewnosc: zalozenie, zrodlo: 'decyzja autora 13.11: „od czasu do czasu”, najwyżej jedna na kilka rund'}
  od_rundy: {wartosc: 2, pewnosc: zalozenie, zrodlo: 'pierwszy tydzień to otwarcie, bez dodatkowych spraw'}
  bez_odpowiedzi: odmowa   # gdy drużyna nie odpowie do końca rundy, liczy się odpowiedź o tym id

propozycje:
- id: catering_umcs
  kto: gosc
  od_rundy: 3
  tekst: 'Dzień dobry, jestem z samorządu studentów UMCS. Catering na 120 osób w piątek, damy radę? Płacimy przelewem.'
  odpowiedzi:
  - id: tak
    tekst: 'Bierzemy, po cenie z menu.'
    reakcja: 'Super! To w piątek o 18:00 pod Chatką Żaka.'
    skutki: {porcje: 120, opinia: 0.05, ryzyko_kontroli: 0.05}
  - id: rabat
    tekst: 'Bierzemy, z rabatem 15% za dużą ilość.'
    reakcja: 'Z rabatem? To biorę od razu i polecę was na grupie roku.'
    skutki: {porcje: 120, rabat: 0.15, opinia: 0.1, ryzyko_kontroli: 0.05}
  - id: odmowa
    tekst: 'Nie damy rady, kuchnia jest za mała.'
    reakcja: 'Szkoda. To zamówimy pizzę.'
    skutki: {}

- id: kapela_papkina
  kto: papkin
  od_rundy: 3
  tekst: 'Przyprowadzę wam całą kapelę po koncercie! Tylko pierwsza kolejka na koszt firmy, inaczej nie przyjdą.'
  odpowiedzi:
  - id: tak
    tekst: 'Dobra, pierwsza kolejka od nas.'
    reakcja: 'Lew Północy dotrzymuje słowa! Zazwyczaj.'
    szansa: 0.5
    skutki: {darmowe_porcje: 8, porcje: 40, opinia: 0.05}
    skutki_porazka: {darmowe_porcje: 8}
  - id: odmowa
    tekst: 'Najpierw kapela, potem rozmowa o rabatach.'
    reakcja: 'Ech, bez fantazji. Ale może kiedyś wpadnę.'
    skutki: {}

- id: skarga_dulskiej
  kto: dulska
  od_rundy: 4
  tekst: 'Mieszkam piętro wyżej i ten zapach czosnku wchodzi mi do salonu. Albo coś z tym zrobicie, albo piszę skargę.'
  odpowiedzi:
  - id: pochlaniacz
    tekst: 'Montujemy lepszy pochłaniacz.'
    reakcja: 'No proszę. Kulturalni ludzie jednak.'
    skutki: {koszt: 1800}
  - id: przeprosiny
    tekst: 'Przepraszamy i zapraszamy na obiad.'
