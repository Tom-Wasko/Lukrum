# Ekran „Nawiązania i źródła” (strona /zrodla, wątek 03/prawo, decyzja szefa 23.11.2026).
# Tylko prezentacja: silnik tego pliku nie czyta (panel_gracza/zrodla.py → strona /zrodla).
# Fakty ze źródeł, bez ocen prawnych. Nowa grafika, font, nagranie albo lektura: dopisz wiersz (pilnuje test_zrodla.py).
# Wykaz roboczy: dokumentacja/wiedza/wykaz-grafik-i-fontow.md (repozytorium projektu), klucz do nawiązań: INSTRUKCJA.md.
opis: 'Strona /zrodla: nawiązania literackie, źródła liczb i prawa, autorzy grafik, fontów i nagrań, mapa OpenStreetMap. Silnik tego pliku nie czyta.'
zrodlo: 'Decyzja szefa 23.11.2026 (Z23); klucz nawiązań z INSTRUKCJA.md, wykaz grafik i fontów z dokumentacja/wiedza/wykaz-grafik-i-fontow.md.'
tytul: Nawiązania i źródła
wstep: >-
  LUKRUM jest grą edukacyjną. Tu zebrano, skąd wzięły się nazwy i postacie z lektur, na jakich źródłach oparto liczby
  i prawo oraz kto jest autorem grafik, krojów pisma, nagrań i mapy.
zastrzezenie: >-
  Nazwy prawdziwych firm i miejsc oddają realia Lublina, a oferty, ceny i zdarzenia w grze są fikcyjne. Gra nie jest
  związana z tymi firmami i nie jest poradą prawną ani inwestycyjną. Znaki towarowe należą do ich właścicieli.
nawiazania:
  opis: >-
    Gra nie podpisuje postaci i nazw na ekranach, bo zgadywanie, skąd się wzięły, jest częścią zabawy (i dobrym pytaniem
    na lekcję polskiego). Postacie są własnymi interpretacjami: mówią dzisiejszym językiem o cenach kebaba, a nie
    cytatami z książek. Klucz poniżej jest dla chętnych i dla prowadzących.
  pozycje:
    - {w_grze: 'Pan Ignacy Rzecki (bywalec), bank Oszczędności Rzeckiego, bank Wokulski i S-ka', utwor: '„Lalka”', autor: Bolesław Prus}
    - {w_grze: 'Pan Zagłoba (bywalec), bank Kmicic', utwor: 'Trylogia: „Ogniem i mieczem”, „Potop”', autor: Henryk Sienkiewicz}
    - {w_grze: 'Pani Aniela Dulska (bywalczyni)', utwor: '„Moralność pani Dulskiej”', autor: Gabriela Zapolska}
    - {w_grze: 'Doktor Tomasz Judym (bywalec)', utwor: '„Ludzie bezdomni”', autor: Stefan Żeromski}
    - {w_grze: 'Papkin (bywalec)', utwor: '„Zemsta”', autor: Aleksander Fredro}
    - {w_grze: 'Józio (bywalec)', utwor: '„Ferdydurke”', autor: Witold Gombrowicz}
    - {w_grze: 'bank Ziemia Obiecana', utwor: '„Ziemia obiecana”', autor: Władysław Reymont}
    - {w_grze: 'bank Soplicowo', utwor: '„Pan Tadeusz”', autor: Adam Mickiewicz}
    - {w_grze: 'biuro Józef K.', utwor: '„Proces”', autor: Franz Kafka}
    - {w_grze: 'biuro Scrooge', utwor: '„Opowieść wigilijna”', autor: Charles Dickens}
    - {w_grze: 'biuro Asteroida 328', utwor: '„Mały Książę”', autor: Antoine de Saint-Exupéry}
    - {w_grze: 'Kantor „U Harpagona”', utwor: '„Skąpiec”', autor: Molier}
liczby:
  opis: >-
    Liczby gry leżą w jednym pliku (dane/zalozenia.yaml i pokrewnych) i nie są wpisane w kod. Przy każdej jest zapisane,
    skąd pochodzi i jak jest pewna: „potwierdzone” (ze źródła), „skalibrowane” (dobrane do pomiarów) albo „założenie”
    (decyzja autora, żeby gra była czytelna). Przepisy w grze są uproszczone do poziomu lekcji.
  zrodla:
    - {nazwa: 'Główny Urząd Statystyczny (GUS)', co: 'przeciętne wynagrodzenie, ceny, dane o gospodarce', adres: 'https://stat.gov.pl/'}
    - {nazwa: 'Internetowy System Aktów Prawnych (ISAP)', co: 'teksty ustaw i rozporządzeń cytowanych w opisach liczb', adres: 'https://isap.sejm.gov.pl/'}
    - {nazwa: 'Zakład Ubezpieczeń Społecznych (ZUS)', co: 'składki i zasady ubezpieczeń', adres: 'https://www.zus.pl/'}
    - {nazwa: 'Państwowa Inspekcja Pracy (PIP)', co: 'zasady kontroli zatrudnienia', adres: 'https://www.pip.gov.pl/'}
  przepisy:
    - Kodeks pracy (m.in. art. 22 § 1 i art. 281)
    - Kodeks cywilny
    - ustawa o podatku dochodowym od osób fizycznych (PIT) i ustawa o podatku od towarów i usług (VAT)
    - ustawa o systemie ubezpieczeń społecznych
    - ustawa o rynku pracy i służbach zatrudnienia
    - ustawa o prawach konsumenta
    - ustawa o prawie autorskim i prawach pokrewnych (art. 36)
    - rozporządzenie w sprawie kas rejestrujących
    - rozporządzenie Rady Ministrów w sprawie płacy minimalnej
  uwaga: >-
    Dokładne artykuły i daty przy każdej liczbie są w polu „zrodlo” w plikach danych. Notki prawne do instrukcji
    (kontrola PIP, ZUS, lichwa) czekają jeszcze na przegląd prawnika.
grafiki:
  opis: "Wszystkie grafiki w grze są własne: rysuje je skrypt projektu, a żadna nie odtwarza cudzego logo ani znaku firmy."
  pozycje:
    - {co: 'Ilustracje, postacie, wnętrza, ikony (pliki SVG)', autor: 'autor projektu LUKRUM', licencja: 'własne'}
    - {co: 'Ikony marek i ról w kartach', autor: 'autor projektu LUKRUM', licencja: 'własne; nazwy prawdziwych firm mają tylko ogólne ikony branżowe'}
    - {co: 'Mapa Lublina', autor: 'kolega autora na podstawie danych OpenStreetMap', licencja: 'ODbL'}
mapa:
  nazwa: '© autorzy OpenStreetMap'
  adres: 'https://www.openstreetmap.org/copyright'
  licencja: 'Open Database License (ODbL) 1.0'
  opis: 'Układ ulic i budynków pochodzi z OpenStreetMap, pobrano 15.11.2026.'
fonty:
  opis: Kroje pisma leżą w grze lokalnie i działają bez internetu. Wszystkie na licencji SIL Open Font License 1.1.
  pozycje:
    - {nazwa: Oswald, autor: 'The Oswald Project Authors', adres: 'https://github.com/googlefonts/OswaldFont'}
    - {nazwa: PT Sans, autor: 'ParaType Ltd.', adres: 'https://www.paratype.com/'}
    - {nazwa: Alfa Slab One, autor: 'The Alfa Slab One Project Authors', adres: 'https://jmsole.cl/'}
    - {nazwa: Atkinson Hyperlegible, autor: 'Braille Institute of America, Inc.', adres: 'https://brailleinstitute.org/freefont'}
    - {nazwa: Caveat, autor: 'The Caveat Project Authors', adres: 'https://github.com/googlefonts/caveat'}
oprogramowanie:
  - {nazwa: 'Chart.js 4.4.4 (wykresy)', licencja: MIT, adres: 'https://www.chartjs.org/'}
nagrania:
  opis: >-
    Radio „Fala Koziołka” gra nagrania z domeny publicznej i wolnych licencji (Library of Congress, Musopen, Fundacja
    Wolne Lektury). Autor, wykonawca, rok, źródło i licencja każdego nagrania są na osobnej stronie.
  adres: /nagrania-w-radiu
  uwaga: 'Przy audiobooku „Lalki” (Bolesław Prus) licencja Wolnej Sztuki 1.3 wymaga podania autora, wykonawcy i licencji: robi to ten spis.'
