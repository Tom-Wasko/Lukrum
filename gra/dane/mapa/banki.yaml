# Banki w LUKRUM (silnik/pieniadze/banki.py) – pięć fikcyjnych banków z nazwami z lektur, każdy z inną specjalizacją
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Konto firmowe (opłata miesięczna, terminal: abonament miesięczny + prowizja od płatności kartą), lokaty
  (okres w rundach → oprocentowanie roczne), debet (włączany decyzją: limit, opłata i odsetki za tydzień,
  który kończy się na minusie; ponad limit albo bez zgody banku – wyższe odsetki karne, a bez zgody także stała opłata), kredyty (start – bez historii, inwestycyjny – z zastawem,
  obrotowy) i leasing sprzętu. Oprocentowanie roczne, w rundzie (tygodniu) 1/52. Produkty (lokaty, kredyty, leasing)
  tylko w banku, w którym firma ma konto firmowe. Banki są fikcyjne (nazwy z lektur, bez przedrostka „Bank”); prawdziwe
  banki na mapie miasta to tło.'
zrodlo: 'Własna oferta LUKRUM (13.11.2026, tor A): każdy bank opłaca się innej strategii (kredyt na start, kredyt
  inwestycyjny, leasing, lokaty, tanie konto i duży debet – od 18.11.2026 pięć banków, Solaris usunięty). Liczby – rząd wielkości rynku 2026 przy stopie
  referencyjnej NBP ok. 4% (kredyty obrotowe dla firm ok. 9–12%, lokaty 1–4%, konta firmowe 0–35 zł miesięcznie),
  dobrane pomiarami botów (raport mechaniki-a); nazwy – plan przebudowy, rozdz. 11'
udzial_kart: 0.7          # część sprzedaży płacona kartą (prowizja terminala)
historia_rund: 4          # „firma z historią” – tyle rund od otwarcia pierwszego lokalu (kredyty z historia: true)
# Stopa referencyjna NBP przyjęta w grze na 14.11.2026 (ok. 4%; do aktualizacji, gdy zmieni się w rzeczywistości). Z niej
# silnik.dane sprawdz liczy dwa limity prawne – żadna stopa w tym pliku nie może ich przekroczyć:
#   debet za zgodą banku ≤ odsetki maksymalne: 2 × (stopa ref. + 3,5 pp) = 15%, art. 359 § 2¹ KC;
#   debet bez zgody ≤ maksymalne odsetki za opóźnienie: 2 × (stopa ref. + 5,5 pp) = 19%, art. 481 § 2¹ KC.
stopa_referencyjna_nbp: 0.04
marza_odsetki_maksymalne: 0.035    # 3,5 pp – art. 359 § 2¹ KC
marza_odsetki_opoznienie: 0.055    # 5,5 pp – art. 481 § 2¹ KC
stopa_karna: 0.19         # odsetki za opóźnienie i debet ponad limit albo bez zgody (maksymalne odsetki za opóźnienie)
# debet bez zgody banku na koniec tygodnia: stała opłata za niedozwolone saldo debetowe (wyższa niż opłata którego-
# kolwiek banku za debet za zgodą) i stopa karna – zawsze drożej niż debet za zgodą
oplata_debet_bez_zgody: 120
# zmiana banku przy otwartym debecie: gdy gotówka wystarcza, debet jest spłacany ze starego banku; gdy nie – nowy bank
# przejmuje go za jednorazową opłatą (procent kwoty, nie mniej niż najmniejsza opłata za debet w bankach)
przejecie_debetu:
  procent: 0.02
  pewnosc: zalozenie
  zrodlo: 'decyzja autora 14.11.2026 (założenie 2% kwoty debetu); w rzeczywistości przeniesienie zadłużenia w rachunku do innego banku to refinansowanie z prowizją (zwykle ok. 1–3%)'
przejecie_po: 3           # tyle rund z rzędu bez raty → bank przejmuje zastaw (kredyt) albo sprzęt (leasing)
wycena_zastawu: 0.8       # bank przyjmuje zastaw po tej części wartości netto
# lokaty, kredyty i leasing tylko w banku konta firmowego – wybór banku to wybór oferty (np. kredyt pod zastaw tylko
# z kontem w Wokulski i S-ka); false – w dowolnym banku
tylko_bank_konta: true
czynsz_po_przejeciu: 0.006  # przejęty lokal bank wynajmuje firmie: miesięczny czynsz jako część ceny (gdy lokal nie ma czynszu)
# budynek z najemcą kupowany w rundzie (wykup albo budynek rywala) jest zastawem kredytu inwestycyjnego już w tej
# rundzie (jak kupowany lokal), a kupiony – jak kupiony lokal
zastaw_przejecia: true
banki:
- nazwa: Kmicic
  specjalizacja: szybki kredyt na start (drogi)
  opis: 'Działa od razu i nie pyta o historię firmy, ale każe sobie za to słono płacić. Nawiązanie: Kmicic z „Potopu”
    Sienkiewicza – porywczy, działa pierwszy, myśli potem.'
  konto: 35
  terminal: {abonament: 59, prowizja: 0.013}
  lokaty: {1: 0.008, 4: 0.015, 13: 0.02}
  debet: {limit: 8000, oplata: 40, oprocentowanie: 0.15}
  kredyty:
  - {produkt: start, nazwa: Kredyt na start, oprocentowanie: 0.149, prowizja: 0.01, maks_kwota: 60000, maks_rund: 52}
- nazwa: Wokulski i S-ka
  specjalizacja: kredyt inwestycyjny
  opis: 'Najtańszy kredyt na duże kwoty i długa spłata, ale pod zastaw lokalu albo sprzętu. Nawiązanie: Stanisław
    Wokulski z „Lalki” Prusa – kupiec, który rozkręca wielki interes.'
  konto: 25
  terminal: {abonament: 49, prowizja: 0.012}
  lokaty: {1: 0.01, 4: 0.02, 13: 0.025}
  debet: {limit: 10000, oplata: 45, oprocentowanie: 0.14}
  kredyty:
  # inwestycyjny od wzięcia lokalu, bez historii – zabezpiecza go zastaw, także lokal kupowany w tej samej rundzie
  - {produkt: inwestycyjny, nazwa: Kredyt inwestycyjny, oprocentowanie: 0.069, prowizja: 0.015, maks_kwota: 400000,
     maks_rund: 104, od_lokalu: true, zastaw: 0.7}
  - {produkt: obrotowy, nazwa: Kredyt obrotowy, oprocentowanie: 0.109, prowizja: 0.02, maks_kwota: 40000, maks_rund: 52,
     historia: true}
- nazwa: Ziemia Obiecana
  specjalizacja: leasing sprzętu
  opis: 'Sprzęt kuchenny w ratach przy niskiej wpłacie własnej – raty idą w koszty, a po ostatniej wykup za symboliczną
    kwotę. Nawiązanie: „Ziemia obiecana” Reymonta – fabryka budowana bez własnych pieniędzy.'
  konto: 25
  terminal: {abonament: 49, prowizja: 0.012}
  lokaty: {1: 0.009, 4: 0.019, 13: 0.024}
  debet: {limit: 10000, oplata: 50, oprocentowanie: 0.15}
  kredyty:
  - {produkt: obrotowy, nazwa: Kredyt obrotowy, oprocentowanie: 0.115, prowizja: 0.02, maks_kwota: 40000, maks_rund: 52,
     historia: true}
  leasing: {wplata: 0.05, oprocentowanie: 0.075, rund: [26, 52], wykup: 0.01}
- nazwa: Oszczędności Rzeckiego
  specjalizacja: najlepsze lokaty
  opis: 'Najwyższe oprocentowanie lokat – tygodniowych i dłuższych – i ostrożność we wszystkim innym. Nawiązanie:
    Ignacy Rzecki z „Lalki” – sumienny subiekt, który liczy każdy grosz.'
  konto: 20
  terminal: {abonament: 59, prowizja: 0.013}
  lokaty: {1: 0.02, 4: 0.036, 13: 0.042}
  debet: {limit: 5000, oplata: 55, oprocentowanie: 0.15}
  kredyty:
  - {produkt: obrotowy, nazwa: Kredyt obrotowy, oprocentowanie: 0.112, prowizja: 0.02, maks_kwota: 40000, maks_rund: 52,
     historia: true}
- nazwa: Soplicowo
  specjalizacja: tanie konto firmowe i największy debet
  opis: 'Konto bez opłaty i terminal bez abonamentu z najniższą prowizją – gość nie płaci za gościnność. Nawiązanie:
    Soplicowo z „Pana Tadeusza” Mickiewicza – dworek, w którym każdy gość jest mile widziany. Debet też po szlachecku
    – „zastaw się, a postaw się”: największy limit, ale każdy tydzień na minusie słono kosztuje.'
  konto: 0
  terminal: {abonament: 0, prowizja: 0.0079}
  lokaty: {1: 0.008, 4: 0.018, 13: 0.022}
  # balans-katalogi (decyzja autora 18.11.2026: 5 banków, Solaris znika, debet przejmuje Soplicowo); było 6 000 / 45 / 13%
  debet: {limit: 20000, oplata: 80, oprocentowanie: 0.15}
  kredyty:
  - {produkt: obrotowy, nazwa: Kredyt obrotowy, oprocentowanie: 0.118, prowizja: 0.025, maks_kwota: 40000, maks_rund: 52,
