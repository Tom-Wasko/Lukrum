  konto: 25
  terminal: {abonament: 49, prowizja: 0.012}
  lokaty: {1: 0.009, 4: 0.019, 13: 0.024}
  debet: {limit: 10000, oplata: 50, oprocentowanie: 0.15}
  kredyty:
  - {produkt: obrotowy, nazwa: Kredyt obrotowy, oprocentowanie: 0.115, prowizja: 0.02, maks_kwota: 40000, maks_rund: 52,
     historia: true}
  leasing: {wplata: 0.05, oprocentowanie: 0.075, rund: [26, 52], wykup: 0.01}
