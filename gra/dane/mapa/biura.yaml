# Biura rachunkowe w LUKRUM (silnik/ksiegowosc/biuro.py): cztery biura, każde w pakietach S / M / L
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Cztery biura w Kamienicy biur rachunkowych, każde z trzema pakietami S, M i L. Pakiet to miesięczna cena
  (brutto, z VAT 23%, w rundzie tygodniowej przeliczana jak czynsz × 12/52), limit dokumentów w miesiącu (też na
  rundę, zaokrąglony) i dopłata za każdy dokument ponad limit. Dokument = zapis w KPiR, faktura za środek trwały,
  operacja poza KPiR (kredyt, lokata, kaucja, podatek) i faktura biura za rundę. Kadry: opłata za każdego
  pracownika (właściciel się nie liczy), `w_cenie` – tylu ludzi bez dopłaty. `ryzyko_bledu` – szansa na rundę, że
  biuro pomyli się w deklaracji: firma płaci `kara_bledu` (mandat z urzędu), biuro z ubezpieczeniem OC (`oc: true`)
  oddaje ją w tej samej rundzie. `zamkniete_w_swieta` – w tygodniu ze świętem biuro jest zamknięte: dokumenty czekają do następnego tygodnia z dopłatą, `zmiana_pakietu_po`
  – ile rund trwa zmiana pakietu, `bez_limitu` – pakiety bez dopłat za dokumenty. Zmiana biura (także powrót) kosztuje
  jednorazowo `zmiana_biura` tygodni pakietu nowego biura; pierwszy wybór jest bez opłaty. Teksty błędów: {kara}, {biuro}.'
zrodlo: 'Własna oferta LUKRUM (13.11.2026, tor A). Ceny – rząd wielkości rynku Lublina 2026: kb.pl, Cennik biur
  rachunkowych w Lublinie 2026 i pobliskich miastach (KPiR do 10 dokumentów ok. 300 zł netto miesięcznie, 90–100
  dokumentów ok. 1 060 zł netto, kadry ok. 112 zł netto za osobę), przeliczone na brutto (VAT 23%) i na rundę;
  cechy biur i nazwy – plan przebudowy, rozdz. 11 (J.K.Ś. – życzenie autora; Józef K. – Kafka, „Proces”; Scrooge –
  Dickens, „Opowieść wigilijna”; Asteroida 328 – Saint-Exupéry, „Mały Książę”)'

szacunek_dokumentow: 30   # ile dokumentów na rundę zakłada szacunek opłaty, zanim drużyna ma własne dokumenty (i bot)
pakiet_domyslny: M        # pakiet, od którego zaczyna firma po wyborze biura
zmiana_biura:             # jednorazowa opłata za zmianę biura (także powrót do poprzedniego); pierwszy wybór – bez opłaty
  tygodni_pakietu: 1      # równowartość tyle tygodni pakietu NOWEGO biura (koszt usług obcych, dokument do KPiR)
  pewnosc: zalozenie
  zrodlo: 'decyzja autora 14.11.2026: przejście do nowego biura kosztuje tyle, co tydzień jego pakietu (przeniesienie dokumentacji, wdrożenie); w realnych biurach bywa opłata wstępna za przejęcie obsługi'
biura:
- id: jks
  nazwa: J.K.Ś.
  wlasciciel: Jakub Klimek-Ślęzak
  opis: 'Jakub Klimek-Ślęzak przyjmuje w gabinecie, w którym segregatory stoją alfabetycznie, a w każdym
    segregatorze – też alfabetycznie, tylko od tyłu, „żeby urzędnik się zmęczył”. Pan Jakub nie pomylił się
    w deklaracji od 1998 roku, kiedy to wpisał w PIT o jedno zero za mało i do dziś co roku wysyła urzędowi
    kartkę z przeprosinami. Pakiety dla kadr do czterech osób, bo „ludzie to też dokumenty, tylko bardziej się
    ruszają”.'
  cecha: dokładne i uczciwe, z ubezpieczeniem OC
  pakiety:
    S: {cena: 390, dokumenty: 60, doplata: 6.15}
    M: {cena: 690, dokumenty: 120, doplata: 5.5}
    L: {cena: 1050, dokumenty: 200, doplata: 4.9}
  kadry: {w_cenie: 4, etat: 45, zlecenie: 25}
  ryzyko_bledu: 0
  oc: true
- id: jozef_k
  nazwa: Józef K.
  opis: 'Biuro w oficjalnym budynku bez tabliczki. Józef K. jest tani i bardzo uprzejmy, ale wszystko u niego trwa:
    żeby zmienić pakiet, trzeba złożyć wniosek w trzech egzemplarzach i poczekać dwa tygodnie. Mówią, że sam nie wie,
    o co jest oskarżony, ale deklaracje składa. Nie ma OC, więc przy pomyłce mandat płacisz Ty.'
  cecha: tanie, ale wszystko trwa (zmiana pakietu po 2 rundach)
  zmiana_pakietu_po: 2
  pakiety:
    S: {cena: 250, dokumenty: 60, doplata: 4.9}
    M: {cena: 450, dokumenty: 120, doplata: 4.3}
    L: {cena: 700, dokumenty: 200, doplata: 3.7}
  kadry: {w_cenie: 0, etat: 61.5, zlecenie: 30.75}
  ryzyko_bledu: 0.04
  oc: false
- id: scrooge
  nazwa: Scrooge
  opis: 'Najtańsze biuro w mieście. Pan Scrooge uważa święta za wymysł kasjerów: w święta biuro jest zamknięte, a deklaracje
    składa praktykant, który właśnie liczy, ile kosztują światełka na choince. Poza tym działa jak w zegarku, o ile
    nie trzeba nic dopłacać do herbaty.'
  cecha: najtańsze, ale w tygodniach ze świętem zamknięte – dokumenty czekają tydzień i wchodzą do następnego tygodnia z dopłatą 6 zł za każdy oraz z limitem pakietu liczonym od nowa, więc dokumenty ponad limit tygodnia kosztują dodatkowo (w ostatniej rundzie biuro rozlicza wszystko przy zamknięciu gry, też dokumenty przeniesione po święcie)
  zamkniete_w_swieta:
    doplata: 6.0
    zrodlo: 'decyzja autora 14.11.2026: w tygodniu ze świętem biuro jest zamknięte, dokumenty przechodzą na następny tydzień, a biuro dolicza 6 zł brutto za każdy dokument (wcześniej 3 zł)'
  pakiety:
    S: {cena: 190, dokumenty: 60, doplata: 3.7}
    M: {cena: 360, dokumenty: 120, doplata: 3.3}
    L: {cena: 560, dokumenty: 200, doplata: 2.9}
  kadry: {w_cenie: 0, etat: 73.8, zlecenie: 36.9}
  ryzyko_bledu: 0.02
  oc: false
- id: asteroida_328
  nazwa: Asteroida 328
  opis: 'Biuro na małej planecie za Kamienicą. Pan Bankier liczy gwiazdy i zapisuje, ile ich ma, żeby nikt mu
    ich nie ukradł – więc każdy dokument sprawdza trzy razy. Nie pomyli się nigdy i nie liczy dokumentów: jedna cena pakietu, żadnych dopłat
    za liczbę dokumentów. Drogo, ale spokojnie.'
  cecha: dokładne i drogie, z OC, kadry do sześciu osób w cenie, bez limitu dokumentów (nigdy dopłaty za dokumenty)
  bez_limitu: true   # decyzja autora 14.11.2026: przewaga nad J.K.Ś. – pakiety bez dopłat za dokumenty ponad limit
  pakiety:
    S: {cena: 590, dokumenty: 60, doplata: 0.0}
