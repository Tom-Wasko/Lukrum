# Założenia (parametry mechanik)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Parametry mechanik gry, których nie widać wprost w jej interfejsie. Każdy ma: wartosc, pewnosc (potwierdzone /
  skalibrowane / zalozenie) i zrodlo. Zmiana tu zmienia działanie silnika bez zmian w kodzie. Kalibracje: pomiary botów (balans/),
  opis: dokumentacja/OPIS_GRY.md.'
popyt:
  elastycznosc_ceny:
    wartosc: 1.096
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × r^(−E1)'
  elastycznosc_wzgledem_rynku:
    wartosc: 1.0035
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × exp(−E2·(r − średnie r firm oferujących usługę)); bez tego członu błąd 9,2%'
  wykladnik_liczby_firm:
    wartosc: 0.247
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × n^(−K)'
  mnoznik_bazowy:
    wartosc: 1.498
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt roczny z instrukcji wystarcza (efekty usług nie poprawiają walidacji), brak różnicy poziomu między grami
      obu serii (różnica 3%, walidacja lepsza bez niej)'
  wspolczynniki_jakosci:
    wartosc:
      '3': 1.0
      '2': 0.654
      '1': 0.616
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      jakość = średnia ważona współczynników gwiazdek sprzętu i zasobów (lepsza od postaci liniowej w gwiazdkach);
      boty: sprzęt 2★, zasoby 1,35–1,96★ co miesiąc'
  wagi_jakosci:
    wartosc:
      pracownicy: 0.0
      sprzet: 0.407
      zasoby: 0.593
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      gwiazdki prowadzących (2,5 → 1,33 → 1,67) bez wpływu (współczynnik ≈ 0)'
  wyposazenie_na_procent_klientow:
    wartosc: 0.073
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      popyt × (1 + κ · Σ % klientów oczekujących wyposażenia / 100); wyposażenie botów (0 → 340%) odczytane z tabel
      „posiadane wyposażenie”'
  utrata_klientow:
    wartosc: 0.0
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: utrata klientów po brakach w poprzednim miesiącu pogarsza walidację krzyżową (8,1%
      wobec 7,6%) – mechanizmu nie ma; spadek efektu firmy tłumaczy wyposażenie botów i sezonowość XI–XII'
  recepcja_1gw_mnoznik:
    wartosc: 1.0
    pewnosc: zalozenie
    zrodlo: 'wyłączone (1,0). W pomiarach: cały sprzęt kasy 1★ od października – efekt firmy spadł o ok. 15%, ale zbiega
      się z innym niewyjaśnionym spadkiem; liniowo dla 2★ psuje drugą serię pomiarów (dwie firmy z kasą 2★: błąd 1,7% →
      9,4%). Możliwy efekt tylko dla 1★ – do potwierdzenia'
  korekta_miesiaca:
    wartosc:
      styczen: 1.0
      luty: 1.0
      marzec: 0.972
      kwiecien: 0.997
      maj: 0.924
      czerwiec: 0.903
      lipiec: 0.97
      sierpien: 1.001
      wrzesien: 0.989
      pazdziernik: 0.961
      listopad: 0.808
      grudzien: 0.796
    pewnosc: skalibrowane
    zrodlo: 'kalibracja z 2026-10-18: panel 361 obserwacji (3 firmy z botami, 11 miesięcy) +
      druga seria pomiarów (2 miesiące); wariant wybrany walidacją krzyżową (10 grup firma-miesiąc), błąd 5,4%, walidacja 6,3%;
      mnożnik ponad sezonowość z instrukcji (luty = 1). Luty–październik w granicach ±10% (sezonowość z instrukcji
      działa, inne przesunięcia miesięcy wypadają gorzej), listopad–grudzień ok. −20% u wszystkich firm. Styczeń
      bez danych'
  szum_proc:
    wartosc: 0.03
    pewnosc: zalozenie
    zrodlo: reszta modelu 4,5% zawiera błędy odczytu; losowe odchylenie popytu firmy na usługę (rozkład log-normalny,
      ziarno gry); 0 = wyłączone
  zaokraglenie:
    wartosc: do_calych_klientow
    pewnosc: zalozenie
    zrodlo: 'założenie autora: klientów zaokrągla się do całych osób'
  postac_ceny:
    wartosc: potega
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: popyt ∝ r^(−E1) (walidacja 6,3%) lepsze niż e^(−E1·(r−1)) (8,8%); r = cena po rabacie
      / cena preferowana'
operacje:
  godziny_pracownika:
    wartosc: 40
    pewnosc: zalozenie
    zrodlo: 'F2.7: etat 40 h w tygodniu (runda = tydzień), czyli 160 h w miesiącu'
  godziny_sprzetu:
    wartosc: 40
    pewnosc: zalozenie
    zrodlo: 'F2.7: jak etat – 40 h sprzętu w tygodniu (160 h w miesiącu)'
  czas_wlasciciela:
    wartosc: 20
    pewnosc: zalozenie
    zrodlo: 'F3a.7: godziny właściciela na rundę (tydzień) na sprawy poza lokalem – odbiór osobisty w dyskontach,
      później pracuj.pl i parki; nie zależy od liczby osób w drużynie (firma ma jednego właściciela)'
  zajecia_zaokraglane_w_gore:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'założenie autora: zajęcia liczy się w pełnych godzinach, w górę'
  model_stanowisk:
    wartosc: pula
    pewnosc: zalozenie
    zrodlo: 'pula godzin (decyzja autora 13.11.2026): w małym kebabie z jednym grillem wszyscy stoją przy tym samym ladzie, więc godziny kucharzy i godziny każdego rodzaju sprzętu liczą się wspólnie dla całego lokalu – sprzęt nie musi stać przy konkretnym kucharzu. „stanowisko” = surowsze założenie, w którym danie wymaga kucharza i sprzętu na jednym stanowisku'
  kolejnosc_obslugi:
    wartosc: proporcjonalnie
    pewnosc: zalozenie
    zrodlo: przy braku mocy przerobowych klienci usług na stanowisku obsługiwani proporcjonalnie do popytu
  braki_wykladnik_godzin:
    wartosc: -1.55
    pewnosc: skalibrowane
    zrodlo: 'kalibracja: przy braku zasobu obsłużeni ∝ popyt · (godziny zajęć)^α (pomiar z kwietnia – brak płynu,
      grudzień – brak napoju): błąd 19% wobec 32% przy podziale proporcjonalnym; cena, grupa i popyt nie poprawiają
      dopasowania'
finanse:
  kapital_startowy:
    wartosc: 40000
    pewnosc: zalozenie
    zrodlo: 'notatka „Ustalenia gry”: kapitał startowy 40 000 zł (zmiana 26.10)'
  placa_minimalna:
    wartosc: 4806
    pewnosc: potwierdzone
    zrodlo: 'rozporządzenie Rady Ministrów: płaca minimalna od 1.01.2026 (4806 zł brutto)'
  zus_pracodawcy:
    wartosc: 0.19
    pewnosc: zalozenie
    zrodlo: 'założenie autora: składki pracodawcy w przybliżeniu 19% płacy brutto'
  amortyzacja_prog:
    wartosc: 10000
    pewnosc: potwierdzone
    zrodlo: 'ustawa o PIT: próg środka trwałego 10 000 zł, poniżej – od razu w koszty'
  amortyzacja_niskocenna:
    wartosc:
      wybor: true    # false – gracz nie wybiera, zakupy poniżej progu zawsze w koszty
      stawka: 0.2    # roczna stawka amortyzacji zakupów poniżej progu, gdy firma je amortyzuje
    pewnosc: zalozenie
    zrodlo: 'B6 (7.11.2026): wybór gracza – domyślnie w koszty, więc dane zamrożone liczą jak dotąd'
  amortyzacja_powyzej_progu_miesiecznie:
    wartosc: 0.1
    pewnosc: zalozenie
    zrodlo: 'założenie autora: 10%; nie wiadomo, czy miesięcznie – w pomiarach brak sprzętu powyżej 10 000 zł'
  amortyzacja_roczna:
    wartosc:
      lokal: 0.025
      budynek: 0.025
      grunt: 0
      sprzet: 0.2
      wyposazenie: 0.2
    pewnosc: zalozenie
    zrodlo: 'gra z lokalami (F3a.6): stawki roczne jak w wykazie stawek amortyzacyjnych – budynki i lokale niemieszkalne
      2,5%, grunt bez amortyzacji, sprzęt i wyposażenie 20%; amortyzacja liniowa co rundę'
  sprzedaz_sprzetu:
    wartosc: 0.5
    pewnosc: skalibrowane
    zrodlo: 'sprzedaż sprzętu r9: ≈ 50% ceny, w dół do 10 PLN'
  sprzedaz_udogodnien:
    wartosc: 0.5
    pewnosc: zalozenie
    zrodlo: 'założenie autora: sprzęt sprzedaje się za połowę ceny zakupu'
  lokata_odsetki:
    wartosc: proste_miesieczne
    pewnosc: zalozenie
    zrodlo: założenie autora (odsetki proste, naliczane co rundę)
  kredyt_odsetki:
    wartosc: proste_miesieczne
    pewnosc: zalozenie
    zrodlo: 'założenie autora: odsetki proste, np. 100 zł na 1 miesiąc przy 10% rocznie to 0,83 zł'
  kredyt_odnawialny_automatyczny:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'założenie autora: kredyt odnawia się sam, dopóki gracz go nie spłaci'
  inwestor_ratunkowy:
    wartosc:
      max_kwota: 40000
      udzial: 0.3
      rund: 8
    pewnosc: zalozenie
    zrodlo: 'Z3 (Plan optymalizacji, odpowiedź autora: „Inwestor za udział w wyniku”, „Wpłata jako dług”): mistrz gry
      ratuje drużynę z debetem ponad limit wpłatą do max_kwota (kapitał startowy); inwestor przez `rund` rund bierze
      `udzial` dodatniego dochodu netto rundy, a niezwrócona wpłata liczy się jak dług – wartości do kalibracji'
pomylki:   # pomyłki w szczycie (silnik/kuchnia/operacje.py) zamiast reklamacji
  szansa:
    wartosc:
      prog_szczytu: 0.7
      za_szczyt: 0.10
      zmeczenie_od: 0.85
      za_zmeczenie: 0.06
      bez_szkolen: 0.02
      maks: 0.4
    pewnosc: zalozenie
    zrodlo: 'własny model LUKRUM (tor A): szansa pomyłki przy daniu = skłonność do pomyłek kucharza (kandydaci.yaml, 0,2–4%)
      + za_szczyt × (obciążenie kuchni − prog_szczytu) ÷ (1 − prog_szczytu), obciążenie = godziny potrzebne ÷ dostępne
      w danym dniu (najwyżej pełny dodatek) + za_zmeczenie × udział nadgodzin obsady (wykorzystanie w poprzednim tygodniu
      ponad zmeczenie_od) + bez_szkolen, gdy firma nie ma w tym tygodniu żadnego szkolenia; najwyżej maks. Pomyłka =
      to samo danie robione ponownie (zużywa składniki) i obniżona ocena gości. Liczby okrągłe, dobrane pomiarem botów
      (raport mechaniki-a); dawny mnożnik 0,15 na ryzyku pracownika usunięty'
losowosc:
  ceny_dostawcow:
    wartosc:
      odchylenie: 0.044
      powrot_do_bazy: 0.6
      max_zmiana: 0.17
      mnoznik_odchylenia: 1.3
    pewnosc: skalibrowane
    zrodlo: 'analiza_cen_dostawcow.py; mnożnik odchylenia 1,3: odchylenie std cen ≈ 5,7%'
  kandydaci:
    wartosc:
      rozrzut_pensji: 0.03
    pewnosc: zalozenie
    zrodlo: te same osoby w różnych grach mają pensje różniące się o 2–4%
magazyn:   # gra z lokalami (zmiana 26.10): bez kosztu magazynowania i zwrotów – wynajem chłodni i kontrole sanepidu
  wynajem_zl_za_litr:
    wartosc: 1
    pewnosc: zalozenie
    zrodlo: 'odpowiedź użytkownika 26.10: towar, który nie mieści się w chłodni lub zamrażarce lokalu, jedzie do
      wynajętej chłodni – 1 zł brutto (VAT 23%) za litr nadmiaru przy dostawie'
  wynajem_skrocenie_terminu_dni:
    wartosc: 2
    pewnosc: zalozenie
    zrodlo: 'odpowiedź użytkownika 26.10: towar w wynajętej chłodni ma termin krótszy o 2 dni (nie krótszy niż do
      dnia dostawy)'
  sanepid:
    wartosc:
      szansa_bazowa: 0.03
      szansa_za_litr_wynajmu: 0.0005
      szansa_za_zl_przeterminowanych: 0.0004
      szansa_max: 0.6
      mandat_min: 300
      mandat_za_litr_wynajmu: 1
      mandat_za_zl_przeterminowanych: 0.5
      mandat_max: 3000
      popyt_po_mandacie: 0.93
      rund_spadku: 2
    pewnosc: zalozenie
    zrodlo: 'odpowiedź użytkownika 26.10 (kontrole sanepidu zamiast kosztu magazynowania): co rundę szansa kontroli =
      bazowa + za litr w wynajętej chłodni + za zł przeterminowanego towaru (najwyżej szansa_max); kontrola kończy
      się mandatem z szansą (szansa − bazowa) / szansa; mandat = min + za litr + za zł strat (od min do max, co 50
      zł), poza KPiR; po mandacie popyt × popyt_po_mandacie przez rund_spadku rund. Liczby – założenie do kalibracji
      w kroku 5 (100 l w wynajmie i 300 zł przeterminowanych → ok. 20% na kontrolę)'
  przewoz:
    wartosc:
      od_rundy: 2
      czas_wlasciciela: 1
      koszt_kursu: 30
      skrocenie_terminu_dni: 1
    pewnosc: zalozenie
    zrodlo: 'przebudowa 2.11.2026 (Z2, raporty/przebudowa_zakladek.md): towar między własnymi lokalami przewozi
      właściciel – kurs (para lokali, jeden dzień) zajmuje 1 h jego czasu i kosztuje 30 zł brutto (paliwo,
      parkowanie); przewieziona partia traci 1 dzień terminu (nie krótszy niż dzień przewozu). Pracowników nie
      przenosi się. Liczby – założenie do kalibracji'
lista_bledow:   # gra z lokalami (F4.2): progi ostrzeżeń na liście błędów
  udzial_skladnikow:
    wartosc: 0.5
    pewnosc: zalozenie
    zrodlo: 'F4.2: pomarańczowe ostrzeżenie, gdy koszt składników porcji (po cenie zapasu, a bez zapasu – po
      najniższej średniej cenie z danych) przekracza tę część ceny dania; poniżej kosztu – czerwone. W gastronomii
      składniki to zwykle 25–35% ceny (PRACA_NOCNA, pyt. 23)'
  przeterminowanie_min_zl:
    wartosc: 20
    pewnosc: zalozenie
    zrodlo: 'F4.2: ostrzeżenie o składniku, który przy prognozie popytu przeterminuje się przed użyciem, dopiero od tej
      wartości straty w tygodniu (drobne resztki nie zaśmiecają listy błędów; PRACA_NOCNA, pyt. 23)'
  scal_dania_od:
    wartosc: 2
    pewnosc: zalozenie
    zrodlo: 'U5 (analiza gracza [5]): od tylu dań bez sprzętu (albo bez kucharza) w jednym lokalu lista błędów pokazuje
      jedną pozycję „lokal do urządzenia” zamiast osobnej linijki na każde danie'
wnioski:   # gra z lokalami (Q13): zakładka „Wnioski z rundy” – od jakich progów pojawia się rada (silnik/wyniki/wnioski.py)
  utracona:
    wartosc: 0.1
    pewnosc: zalozenie
    zrodlo: 'test gry 28.10: rada „klienci odeszli” dla dania, gdy nieobsłużona część chętnych to co najmniej tyle
      (drobne straty w szczycie nie zaśmiecają wniosków)'
  prognoza:
    wartosc: 0.3
    pewnosc: zalozenie
    zrodlo: 'test gry 28.10: rada o prognozie popytu (Menu), gdy różni się od prawdziwego popytu dania o co najmniej
      tyle w górę albo w dół'
  wzrost_klientow:
    wartosc: 0.05
    pewnosc: zalozenie
    zrodlo: 'UF23 (7.11.2026): pochwała „klientów więcej niż tydzień wcześniej” – od takiego względnego wzrostu
      liczby obsłużonych klientów'
  dlaczego_min:
    wartosc: 0.05
    pewnosc: zalozenie
    zrodlo: 'U16 (4.11.2026): „Dlaczego mój wynik się zmienił?” – od takiej zmiany wyniku działalności między rundami
      gra szuka przyczyny (mniejsza zmiana: jedno zdanie „prawie bez zmian”)'
  bledy_max:
    wartosc: 3
    pewnosc: zalozenie
    zrodlo: 'test gry 28.10: najwyżej tyle czerwonych punktów listy błędów rundy we wnioskach (reszta – zakładka Lista
      błędów), żeby wnioski nie zniechęcały'

wynik:   # wynik punktowy: pięć działów po 0–200 pkt, tydzień 1 to „Wielkie otwarcie” (silnik/wyniki/punkty.py)
  mandaty_w_dochodzie:
    wartosc: true
    pewnosc: zalozenie
    zrodlo: 'mandaty rundy (skarbowe za deklaracje, z błędu biura bez OC, sanepidu) i odsetki Harpagona obniżają dochód
      tygodnia, który liczy dział „Finanse”; KPiR i podatki bez zmian. false – wynik liczy dochód z KPiR'
  dzialy:
    wartosc:
      finanse:
        nazwa: Finanse
        opis: Ile firma zarabia w tygodniu i ile z każdej złotówki sprzedaży zostaje po kosztach.
        skladniki:
          dochod:
            nazwa: Dochód netto tygodnia
            jednostka: zł
            podpowiedz: Sprzedawaj więcej i z rozsądną marżą, pilnuj kosztów stałych.
            progi: [[-3000, 0], [0, 20], [3000, 60], [6000, 105], [10000, 140]]
            ponad: {za: 1000, pkt: 10, maks: 40}
          marza:
            nazwa: Marża (dochód ÷ przychód)
            jednostka: udział
            podpowiedz: Wysoka marża to dobre ceny przy rozsądnych kosztach towaru i płac.
            progi: [[-0.2, 0], [0, 15], [0.1, 35], [0.2, 50], [0.3, 60]]
            ponad: {za: 0.1, pkt: 8, maks: 20}
      goscie:
        nazwa: Goście
        opis: Czy goście dostają to, po co przyszli, i ilu ich jest.
        skladniki:
          zadowolenie:
            nazwa: Zadowolenie gości (0–100)
            jednostka: pkt
            podpowiedz: Dobre składniki i obsługa, uczciwa cena, bez kolejek, braków dań i pomyłek.
            progi: [[30, 0], [60, 40], [80, 70], [95, 80]]
          obsluzeni:
            nazwa: Obsłużeni z chętnych
            jednostka: udział
            podpowiedz: Więcej rąk, sprzętu i towaru na szczyt, żeby nikt nie odchodził z kolejki.
            progi: [[0.4, 0], [0.7, 35], [0.9, 60], [1.0, 70]]
          liczba:
            nazwa: Liczba obsłużonych gości
            jednostka: osób
            podpowiedz: Dobry lokal, reklama i cena przyciągają tłum, ale trzeba go obsłużyć.
            progi: [[200, 0], [1000, 25], [2000, 50]]
            ponad: {za: 400, pkt: 8, maks: 30}
      zespol:
        nazwa: Zespół
        opis: Jak się pracuje w firmie – nastrój, obciążenie, szkolenia i udogodnienia.
        skladniki:
