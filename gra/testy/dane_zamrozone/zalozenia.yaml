    pewnosc: zalozenie
    zrodlo: 'własny system punktowy LUKRUM (13.11.2026, tor A): tabela jawnych progów, punkty rosną liniowo między
      progami, poniżej pierwszego progu – wartość pierwszego, powyżej ostatniego – „ponad” (za każde `za` jednostek
      `pkt` punktów, najwyżej `maks`), więc dział może przekroczyć 200. Progi dobrane pomiarami botów
      (balans.symuluj, raport mechaniki-a): dobra gra ≈ 1000 pkt, słaba 400–600'
  oceny:
    wartosc: [0.45, 0.7]   # udział 200 pkt działu: od „średni”, od „dobry”
    pewnosc: zalozenie
    zrodlo: 'słowo i kolor przy dziale w karcie wyników: poniżej 90 pkt niski, od 140 pkt dobry (założenie autora toru A)'
  goscie:
    wartosc:
      baza: 40
      jakosc: 25
      jakosc_od: 0.55
      jakosc_do: 0.82
      cena: 15
      cena_tania: 0.8
      cena_droga: 1.3
      czekanie: 15
      czekanie_zero_przy: 0.3
      braki: 10
      braki_zero_przy: 0.3
      mandat: -10
      wypadek: -4
      pomylki: -40
      do_popytu: 0.012
    pewnosc: zalozenie
    zrodlo: 'własny wzór LUKRUM (tor A; zastąpią go gwiazdki gości w torze B): zadowolenie gości 0–100 = baza + jakość
      dania (mnożnik jakości między jakosc_od a jakosc_do, do `jakosc` pkt) + cena względem ceny strefy lokalu (tania
      cena_tania – pełne `cena`, droga cena_droga – zero) + brak kolejek i brak braków dań (udział utraconych/wyłączonych
      do `…_zero_przy`) − mandat, wypadki i pomyłki w szczycie. `do_popytu` przelicza punkty na mnożnik atrakcyjności
      używany, gdy lokal nie ma jeszcze opinii'
  otwarcie:
    wartosc:
      waga_tygodnia: 0.5
      skladniki:
        lokal:
          nazwa: Lokal
          podpowiedz: Wynajmij albo kup lokal jeszcze w pierwszym tygodniu.
          progi: [[0, 0], [1, 250]]
        menu:
          nazwa: Menu
          podpowiedz: Ustaw ceny i zaplanuj przynajmniej kilka dań.
          progi: [[0, 0], [3, 120], [6, 200]]
        ekipa:
          nazwa: Ekipa
          podpowiedz: Zatrudnij ludzi na stanowiska kuchni i kasy.
          progi: [[0, 0], [1, 100], [3, 250]]
        zaopatrzenie:
          nazwa: Zaopatrzenie
          podpowiedz: Zamów towar na pierwszy tydzień sprzedaży.
          progi: [[0, 0], [800, 150]]
        rezerwa:
